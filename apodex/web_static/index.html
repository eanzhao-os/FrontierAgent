                            : (isZh ? "协调器拆解任务到看板，并行子 Agent 执行后汇总。" : "A coordinator delegates to parallel sub-agents, then synthesizes.")}
                        </p>
                        <div className="flex flex-wrap justify-center gap-2">
                          {(modeIsReact
                            ? [
                                isZh ? "分析当前代码库结构并生成总结" : "Analyze repo structure and summarize",
                                isZh ? "实现高并发 LRU 缓存与单元测试" : "Implement an LRU cache with tests",
                                isZh ? "重构数据校验逻辑" : "Refactor the validation logic",
                              ]
                            : [
                                isZh ? "调研并对比主流 Agent 架构设计方案" : "Research & compare agent architectures",
                                isZh ? "全方位代码审计并出具整改报告" : "Audit the codebase and report findings",
                                isZh ? "构建全套端到端微服务测试流水线" : "Build an end-to-end testing pipeline",
                              ]
                          ).map((preset, i) => (
                            <button
                              key={i}
                              onClick={() => setInputPrompt(preset)}
                              className="cursor-pointer rounded-full px-3 py-1.5 text-[12px] transition-colors duration-100"
                              style={{ backgroundColor: "var(--surface)", boxShadow: "var(--shadow-btn)", color: "var(--ink-2)", border: "none" }}
                              onMouseEnter={(e) => e.currentTarget.style.backgroundColor = "var(--hover)"}
                              onMouseLeave={(e) => e.currentTarget.style.backgroundColor = "var(--surface)"}
                            >
                              {preset}
                            </button>
                          ))}
                        </div>
                      </div>
                    )}

                    {/* Settled messages (chronological: turns, notes) */}
                    {visibleMessages.map((msg) => (
                      <div
                        key={msg.id}
                        data-block-id={msg.id}
                        className="anim-fade-up"
                        style={reviewId && String(reviewId).indexOf(msg.id) === 0 ? { boxShadow: "0 0 0 1px var(--accent)" } : undefined}
                      >
                        {msg.role === "user" ? (
                          <div className="flex justify-end">
                            <div className="max-w-[75%] whitespace-pre-wrap rounded-[10px] px-3.5 py-2.5 text-[13px] leading-relaxed"
                                 style={{ backgroundColor: "var(--accent-tint)", color: "var(--ink)" }}>
                              {msg.content}
                            </div>
                          </div>
                        ) : msg.role === "note" ? (
                          <SystemNoteRow note={{ text: msg.content, tone: msg.tone }} />
                        ) : (
                          <div className="flex flex-col gap-2.5">
                            {msg.thinking && (
                              <ThinkingTrace live={false} text={msg.thinking} elapsedMs={msg.thinkingMs} isZh={isZh} defaultOpen={!shouldCollapseThinking(msg.thinking)} />
                            )}
                            {msg.toolCalls && msg.toolCalls.length > 0 && (
                              <ToolCallsCard toolCalls={msg.toolCalls} isZh={isZh} onOpenPreview={handleOpenPreview} />
                            )}
                            {msg.content && (
                              <div className="md-preview md-inline select-text" style={{ color: "var(--ink)" }}
                                   dangerouslySetInnerHTML={{ __html: window.marked ? window.marked.parse(msg.content) : msg.content }} />
                            )}
                          </div>
                        )}
                      </div>
                    ))}

                    {/* Live stream */}
                    {isBusy && (
                      <div className="flex flex-col gap-2.5">
                        {activeThinking && (
                          <ThinkingTrace
                            live
                            text={activeThinking}
                            elapsedMs={thinkingStartedAt != null ? nowTick - thinkingStartedAt : null}
                            isZh={isZh}
                            defaultOpen
                          />
                        )}
                        {activeToolCalls.length > 0 && (
                          <ToolCallsCard toolCalls={activeToolCalls} isZh={isZh} onOpenPreview={handleOpenPreview} live />
                        )}
                        {activeContent && (
                          <div className="select-text whitespace-pre-wrap text-[13.5px] leading-relaxed" style={{ color: "var(--ink)" }}>
                            {activeContent}<span className="caret" />
                          </div>
                        )}
                        {!activeThinking && !activeContent && activeToolCalls.length === 0 && (
                          <div className="flex items-center gap-2 px-1 text-[12px]" style={{ color: "var(--ink-2)" }}>
                            <Spinner size={11} />
                            <span>{isZh ? "正在思考…" : "Thinking…"}</span>
                            {runningElapsed != null && <span className="mono text-[10.5px] tabular-nums" style={{ color: "var(--ink-3)" }}>{fmtElapsed(runningElapsed)}</span>}
                          </div>
                        )}
                      </div>
                    )}

                    {/* Approval — one question at a time */}
                    {pendingApproval && (
                      <ApprovalCard
                        approval={pendingApproval}
                        feedback={feedbackText}
                        setFeedback={setFeedbackText}
                        onResolve={handleApproval}
                        isZh={isZh}
                      />
                    )}
                  </div>
                </div>

                {/* Composer — one control surface; steer mode while running */}
                <footer className="shrink-0 px-6 pb-4 pt-2">
                  <div className="mx-auto max-w-[680px]">
                    {steerFlash && (
                      <div className="anim-fade-up mb-1.5 flex items-center gap-1.5 px-1 text-[11px]" style={{ color: "var(--accent-ink)" }}>
                        <Icons.steer />
                        <span className="truncate">
                          {isZh ? "已加入注入队列，将在下一个安全轮次生效：" : "Queued — applies at the next safe turn boundary: "}
                          <span className="mono">{steerFlash}</span>
                        </span>
                      </div>
                    )}
                    <div
                      className="flex flex-col gap-1.5 rounded-[10px] p-3 transition-shadow duration-200"
                      style={{
                        backgroundColor: "var(--surface)",
                        boxShadow: isBusy ? "0 0 0 1px var(--accent), 0 2px 10px #0000000b" : "var(--shadow-raised)",
                      }}
                    >
                      {attachedFiles.length > 0 && (
                        <div className="mb-1 flex flex-wrap gap-1">
                          {attachedFiles.map((item) => (
                            <span key={item.relative_path} className="flex items-center gap-1 rounded-md px-1.5 py-0.5 text-[10.5px]" style={{ backgroundColor: "var(--inset)", color: "var(--ink-2)" }}>
                              <span className="mono">{item.relative_path}</span>
                              <button
                                type="button"
                                onClick={async () => {
                                  await safeFetch(`/api/attachments/${encodeURIComponent(item.relative_path)}`, { method: "DELETE" });
                                  refreshWorkspace();
                                }}
                                className="cursor-pointer"
                                style={{ background: "none", border: "none", color: "var(--ink-3)" }}
                              >
                                ×
                              </button>
                            </span>
                          ))}
                        </div>
                      )}
                      {inputPrompt.startsWith("/") && matchSlashCommands(inputPrompt.split(/\s+/)[0], commands).length > 0 && (
                        <div className="mb-1 max-h-40 overflow-y-auto rounded-lg p-1" style={{ backgroundColor: "var(--inset)" }}>
                          {matchSlashCommands(inputPrompt.split(/\s+/)[0], commands).slice(0, 8).map((spec) => (
                            <button
                              key={spec.name}
                              type="button"
                              onClick={() => setInputPrompt(spec.name + (spec.argument_hint ? " " : ""))}
                              className="flex w-full cursor-pointer items-center justify-between rounded-md px-2 py-1 text-left text-[12px]"
                              style={{ background: "none", border: "none", color: "var(--ink)" }}
                            >
                              <span className="mono">{spec.name}</span>
                              <span className="truncate pl-3 text-[11px]" style={{ color: "var(--ink-3)" }}>{spec.description}</span>
                            </button>
                          ))}
                        </div>
                      )}
                      <textarea
                        rows="2"
                        id="fa-composer"
                        aria-label={isZh ? "任务输入框" : "Task composer"}
                        value={inputPrompt}
                        onChange={(e) => setInputPrompt(e.target.value)}
                        onDragOver={(e) => e.preventDefault()}
                        onDrop={(e) => {
                          e.preventDefault();
                          if (e.dataTransfer && e.dataTransfer.files) uploadFiles(e.dataTransfer.files);
                        }}
                        onPaste={(e) => {
                          const files = e.clipboardData && e.clipboardData.files;
                          if (files && files.length) {
                            e.preventDefault();
                            uploadFiles(files);
                            return;
                          }
                          const pasted = e.clipboardData ? e.clipboardData.getData("text") : "";
                          if (pasted && pasted.length > 1000) {
                            e.preventDefault();
                            setInputPrompt((prev) => prev + pasted);
                          }
                        }}
                        onKeyDown={(e) => {
                          if (e.key === "Enter" && !e.shiftKey) {
                            e.preventDefault();
                            const text = inputPrompt.trim();
                            if (text) {
                              inputHistoryRef.current = [text].concat(inputHistoryRef.current.filter((x) => x !== text)).slice(0, 50);
                              historyIndexRef.current = -1;
                            }
                            handleComposerSubmit();
                            return;
                          }
                          if (e.key === "ArrowUp" || e.key === "ArrowDown") {
                            const el = e.currentTarget;
                            const start = el.selectionStart || 0;
                            const before = (el.value || "").slice(0, start);
                            const line = before.split("\n").length;
                            const lines = (el.value || "").split("\n").length;
                            const hist = inputHistoryRef.current;
                            if (e.key === "ArrowUp" && line === 1 && hist.length) {
                              e.preventDefault();
                              if (historyIndexRef.current === -1) historyDraftRef.current = inputPrompt;
                              const next = Math.min(hist.length - 1, historyIndexRef.current + 1);
                              historyIndexRef.current = next;
                              setInputPrompt(hist[next] || "");
                            } else if (e.key === "ArrowDown" && line === lines && historyIndexRef.current >= 0) {
                              e.preventDefault();
                              const next = historyIndexRef.current - 1;
                              historyIndexRef.current = next;
                              setInputPrompt(next < 0 ? historyDraftRef.current : (hist[next] || ""));
                            }
                          }
                        }}
                        placeholder={
                          isBusy
                            ? (isZh ? "实时干预：输入指令，将在下一个安全轮次注入，不打断当前执行…" : "Steer: your instruction is injected at the next safe turn boundary…")
                            : modeIsReact
                              ? (isZh ? "描述任务，ReAct Agent 将自主规划与执行…" : "Describe a task — the ReAct agent plans and executes…")
                              : (isZh ? "描述复杂课题，协调器将拆解到任务看板并分派子 Agent…" : "Describe a complex goal — the coordinator builds a task board and delegates…")
                        }
                        className="w-full resize-none bg-transparent text-[13.5px] outline-none"
                        style={{ color: "var(--ink)", border: "none" }}
                      />
                      <div className="flex items-center gap-2">
                        <span
                          className="flex select-none items-center gap-1 rounded-md px-1.5 py-0.5 text-[10.5px] font-medium"
                          style={{ backgroundColor: modeTint, color: modeInk }}
                        >
                          {modeIsReact ? <Icons.bolt /> : <Icons.users />}
                          {modeIsReact ? "ReAct" : "Team"}
                        </span>
                        <span className="hidden text-[10.5px] sm:inline" style={{ color: "var(--ink-3)" }}>
                          {isBusy
                            ? (isZh ? "Enter 注入 · 不会丢弃当前运行" : "Enter to queue — the active run is kept")
                            : (isZh ? "Enter 发送 · Shift+Enter 换行" : "Enter to send · Shift+Enter for newline")}
                        </span>
                        <div className="ml-auto flex items-center gap-1.5">
                          <input
                            ref={fileInputRef}
                            type="file"
                            multiple
                            className="hidden"
                            onChange={(e) => {
                              uploadFiles(e.target.files);
                              e.target.value = "";
                            }}
                          />
                          <button
                            type="button"
                            aria-label={isZh ? "添加附件" : "Attach files"}
                            onClick={() => fileInputRef.current && fileInputRef.current.click()}
                            className="cursor-pointer rounded-lg p-1.5"
                            style={{ background: "none", border: "none", color: "var(--ink-3)" }}
                            title={isZh ? "添加附件" : "Attach files"}
                          >
                            <Icons.plus />
                          </button>
                          {isBusy && (
                            <button
                              type="button"
                              onClick={handleInterrupt}
                              aria-label={isZh ? "中断当前任务" : "Interrupt the running task"}
                              className="flex cursor-pointer items-center gap-1 rounded-lg px-2.5 py-1.5 text-[11.5px] font-medium transition-colors duration-100"
                              style={{ backgroundColor: "var(--red-tint)", color: "var(--red)", border: "none" }}
                              title={isZh ? "中断当前任务" : "Interrupt the running task"}
                            >
                              <Icons.close />
                              <span>{isZh ? "停止" : "Stop"}</span>
                            </button>
                          )}
                          <button
                            type="button"
                            disabled={!inputPrompt.trim()}
                            onClick={handleComposerSubmit}
                            className="flex size-7 cursor-pointer items-center justify-center rounded-full transition-all duration-150 disabled:cursor-default"
                            style={{
                              backgroundColor: inputPrompt.trim() ? "var(--accent)" : "var(--field)",
                              color: inputPrompt.trim() ? "#fff" : "var(--ink-3)",
                              boxShadow: inputPrompt.trim() ? "none" : "var(--shadow-inset-field)",
                              border: "none",
                            }}
                            title={isBusy ? (isZh ? "注入指令" : "Steer") : (isZh ? "发送" : "Send")}
                          >
                            {isBusy ? <Icons.steer /> : <Icons.send />}
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                </footer>
              </main>

              {/* ─────────── 3. RIGHT PANEL: board / outputs / team / status ─────────── */}
              {showRightSidebar && (
                <aside
                  className={`hidden select-none flex-col overflow-hidden border-l lg:static lg:flex lg:w-80 ${mobilePanelsOpen ? "fixed inset-x-0 bottom-0 z-40 flex h-[62vh] rounded-t-[14px] md:inset-x-auto md:top-0 md:right-0 md:h-auto md:w-80 md:rounded-none lg:inset-auto lg:h-auto lg:rounded-none" : ""}`}
                  style={{ backgroundColor: "var(--surface)", borderColor: "var(--line)", boxShadow: mobilePanelsOpen ? "var(--shadow-overlay)" : undefined }}
                  aria-label={isZh ? "工作面板" : "Work panels"}
                >
                  {mobilePanelsOpen && (
                    <div className="flex items-center justify-between px-3 pb-1 pt-2 lg:hidden">
                      <span className="text-[11px] font-semibold uppercase tracking-wider" style={{ color: "var(--ink-3)" }}>
                        {isZh ? "面板" : "Panels"}
                      </span>
                      <button
                        type="button"
                        aria-label={isZh ? "关闭面板" : "Close panels"}
                        onClick={() => setMobilePanelsOpen(false)}
                        className="cursor-pointer rounded-lg p-1.5"
                        style={{ color: "var(--ink-3)", background: "none", border: "none" }}
                      >
                        <Icons.close />
                      </button>
                    </div>
                  )}
                  <div className="flex gap-0.5 p-1" style={{ backgroundColor: "var(--field)" }}>
                    {[
                      { key: "plan", label: isZh ? "计划" : "Plan", icon: Icons.board, badge: (planItems.length || boardCounts.total) ? `${planItems.filter((i) => i.status === "completed" || i.status === "resolved").length || boardCounts.resolved}/${planItems.length || boardCounts.total}` : null },
                      { key: "activity", label: isZh ? "活动" : "Activity", icon: Icons.terminal, badge: (activityRecords.length || subagents.length) ? String(activityRecords.length || subagents.length) : null },
                      { key: "files", label: isZh ? "文件" : "Files", icon: Icons.boxes, badge: artifacts.length > 0 ? String(artifacts.length) : null },
                      { key: "diff", label: "Diff", icon: Icons.board, badge: diffRows.length ? String(diffRows.length) : null, hide: !(diffRows.length || diffText || diffObserved.length) },
                    ].filter((t) => !t.hide).map((t) => (
                      <button
                        key={t.key}
                        type="button"
                        aria-label={t.label}
                        onClick={() => setRightTab(t.key)}
                        className="flex flex-1 cursor-pointer items-center justify-center gap-1 rounded-md py-1.5 text-[11px] transition-colors duration-100"
                        style={{
                          backgroundColor: rightTab === t.key ? "var(--surface)" : "transparent",
                          boxShadow: rightTab === t.key ? "var(--shadow-hairline)" : "none",
                          color: rightTab === t.key ? "var(--ink)" : "var(--ink-2)",
                          fontWeight: rightTab === t.key ? 500 : 400,
                          border: "none",
                        }}
                      >
                        <t.icon />
                        <span>{t.label}</span>
                        {t.badge && <span className="mono text-[9.5px] tabular-nums" style={{ color: "var(--ink-3)" }}>{t.badge}</span>}
                      </button>
                    ))}
                  </div>

                  <div className="flex-1 space-y-4 overflow-y-auto p-4">
                    {/* ── Task board — the Agent Team centerpiece (ReAct plans land here too) ── */}
                    {(rightTab === "plan" || rightTab === "board") && (
                      <div className="space-y-3">
                        <div className="flex items-center justify-between">
                          <h4 className="text-[11.5px] font-semibold uppercase tracking-wider" style={{ color: "var(--ink-3)" }}>
                            {isZh ? "任务看板" : "Task board"}
                          </h4>
                          {boardCounts.total > 0 && (
                            <span className="mono text-[10.5px] tabular-nums" style={{ color: "var(--ink-3)" }}>
                              {boardCounts.resolved}/{boardCounts.active} {isZh ? "完成" : "done"} · {boardCounts.in_progress} {isZh ? "进行中" : "active"} · {boardCounts.open} {isZh ? "未开始" : "open"}
                              {boardCounts.cancelled > 0 ? ` · ${boardCounts.cancelled} ${isZh ? "已取消" : "cancelled"}` : ""}
                            </span>
                          )}
                        </div>

                        {board.length === 0 ? (
                          <div className="rounded-[10px] p-4 text-center text-[12px] leading-relaxed"
                               style={{ backgroundColor: "var(--inset)", boxShadow: "var(--shadow-hairline)", color: "var(--ink-3)" }}>
                            {isZh
                              ? "Agent 拆解任务后实时呈现"
                              : "Live once the agent decomposes work"}
                          </div>
                        ) : (
                          <div className="overflow-hidden rounded-[10px]" style={{ backgroundColor: "var(--surface)", boxShadow: "var(--shadow-card)" }}>
                            {sortedBoard.map((task, idx) => {
                              const full = descMapRef.current[task.description] || task.description;
                              const state = task.resolution;
                              return (
                                <div
                                  key={task.id}
                                  className="anim-fade-up flex items-start gap-2.5 px-3 py-2.5 text-[12.5px]"
                                  style={{
                                    borderBottom: idx < sortedBoard.length - 1 ? "1px solid var(--line)" : "none",
                                    color: state === "resolved" || state === "cancelled" ? "var(--ink-3)" : "var(--ink)",
                                  }}
                                  title={full !== task.description ? full : undefined}
                                >
                                  <span className="mt-0.5 flex size-4 shrink-0 items-center justify-center">
                                    {state === "in_progress" ? <Spinner size={11} />
                                      : state === "resolved" ? <span style={{ color: "var(--green)" }}><Icons.check /></span>
                                      : state === "cancelled" ? <span style={{ color: "var(--ink-3)" }}><Icons.x /></span>
                                      : <span className="size-2 rounded-full" style={{ border: "1.5px solid var(--line-strong)" }} />}
                                  </span>
                                  <div className="min-w-0 flex-1">
                                    <div style={state === "cancelled" ? { textDecoration: "line-through", textDecorationColor: "var(--ink-3)" } : undefined}>
                                      {full}
                                    </div>
                                    <div className="mt-0.5 flex flex-wrap items-center gap-1">
                                      <span className="mono text-[10px]" style={{ color: "var(--ink-3)" }}>{task.id}</span>
                                      {task.owners.map((o) => (
                                        <span key={o} className="mono rounded px-1 py-px text-[9.5px]"
                                              style={{ backgroundColor: "var(--field)", boxShadow: "var(--shadow-hairline)", color: "var(--ink-2)" }}>
                                          {o}
                                        </span>
                                      ))}
                                    </div>
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        )}

                        {subagents.length > 0 && (
                          <div className="rounded-[10px] p-3 text-[11.5px]"
                               style={{ backgroundColor: "var(--inset)", boxShadow: "var(--shadow-hairline)", color: "var(--ink-2)" }}>
                            <span style={{ color: "var(--ink-3)" }}>{isZh ? "并行子 Agent：" : "Parallel sub-agents: "}</span>
                            {subagents.filter(a => a.status === "running").length} {isZh ? "运行中" : "running"} · {subagents.length} {isZh ? "总计" : "total"}
                          </div>
                        )}
                      </div>
                    )}

                    {/* ── Outputs: sandbox semantics made visible ── */}
                    {(rightTab === "files" || rightTab === "outputs") && (
                      <div className="space-y-4">
                        <div className="flex items-center justify-between">
                          <h4 className="text-[11.5px] font-semibold uppercase tracking-wider" style={{ color: "var(--ink-3)" }}>
                            {isZh ? "沙箱产物" : "Sandbox files"}
                          </h4>
                          <button
                            type="button"
                            onClick={refreshWorkspace}
                            className="flex cursor-pointer items-center gap-1 text-[11px] transition-colors duration-100 hover:underline"
                            style={{ color: "var(--accent-ink)", background: "none", border: "none" }}
                          >
                            <Icons.refresh /><span>{isZh ? "刷新" : "Refresh"}</span>
                          </button>
                        </div>

                        {[
                          { category: "outputs", title: isZh ? "交付产物 · /outputs" : "Deliverables · /outputs", hint: isZh ? "持久化交付物" : "persistent deliverables" },
                        ].map((group) => {
                          const files = artifacts.filter((a) => a.category === group.category);
                          return (
                            <div key={group.category} className="space-y-1.5">
                              <div className="flex items-baseline gap-1.5 px-0.5">
                                <span className="text-[11px] font-semibold" style={{ color: "var(--ink-2)" }}>{group.title}</span>
                                <span className="text-[10px]" style={{ color: "var(--ink-3)" }}>{group.hint}</span>
                              </div>
                              {files.length === 0 ? (
                                <div className="rounded-lg px-3 py-2.5 text-[11.5px]"
                                     style={{ backgroundColor: "var(--inset)", boxShadow: "var(--shadow-hairline)", color: "var(--ink-3)" }}>
                                  {group.category === "outputs"

                              {item.thinking}
                            </pre>
                          )}
                          <div className="whitespace-pre-wrap leading-relaxed" style={{ color: "var(--ink)" }}>
                            {typeof item.content === "string" ? item.content : JSON.stringify(item.content)}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="flex items-center justify-between border-t px-5 py-3" style={{ borderColor: "var(--line)", backgroundColor: "var(--field)" }}>
                  <span className="text-[11.5px]" style={{ color: "var(--ink-3)" }}>
                    {inspectSession.state?.archived ? (isZh ? "（已归档）" : "(Archived) ") : ""}
                    {isZh ? `将以 ${inspectSession.state?.mode} 模式恢复该会话` : `Resumes in ${inspectSession.state?.mode} mode`}
                  </span>
                  <div className="flex items-center gap-2">
                    <button
                      type="button"
                      onClick={() => handleDeleteSession(inspectSession.session_id)}
                      className="flex cursor-pointer items-center gap-1 rounded-lg px-3 py-1.5 text-[12px] font-medium transition-colors duration-100"
                      style={{ backgroundColor: "var(--red-tint)", color: "var(--red)", border: "none" }}
                      title={isZh ? "彻底删除该会话" : "Delete session"}
                    >
                      <Icons.trash />
                      <span>{isZh ? "删除" : "Delete"}</span>
                    </button>
                    <button
                      type="button"
                      onClick={() => handleArchiveSession(inspectSession.session_id, !inspectSession.state?.archived)}
                      className="flex cursor-pointer items-center gap-1 rounded-lg px-3 py-1.5 text-[12px] font-medium transition-colors duration-100"
                      style={{ backgroundColor: "var(--surface)", boxShadow: "var(--shadow-btn)", color: "var(--ink-2)", border: "none" }}
                      title={inspectSession.state?.archived ? (isZh ? "取消归档" : "Restore") : (isZh ? "归档会话" : "Archive")}
                    >
                      {inspectSession.state?.archived ? <Icons.unarchive /> : <Icons.archive />}
                      <span>{inspectSession.state?.archived ? (isZh ? "取消归档" : "Restore") : (isZh ? "归档" : "Archive")}</span>
                    </button>
                    <button
                      type="button"
                      onClick={() => setInspectSession(null)}
                      className="cursor-pointer rounded-lg px-3.5 py-1.5 text-[12px] font-medium transition-colors duration-100"
                      style={{ backgroundColor: "var(--surface)", boxShadow: "var(--shadow-btn)", color: "var(--ink-2)", border: "none" }}
                    >
                      {isZh ? "关闭" : "Close"}
                    </button>
                    <button
                      type="button"
                      disabled={isBusy}
                      onClick={() => handleResumeSession(inspectSession.session_id)}
                      className="flex cursor-pointer items-center gap-1.5 rounded-lg px-4 py-1.5 text-[12px] font-medium text-white transition-all duration-100 hover:brightness-110 disabled:opacity-50"
                      style={{ backgroundColor: "var(--accent)", border: "none" }}
                    >
                      <Icons.bolt />
                      <span>{isZh ? "恢复此会话" : "Resume"}</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    if (window.marked && window.marked.setOptions) {
      window.marked.setOptions({ breaks: true });
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
