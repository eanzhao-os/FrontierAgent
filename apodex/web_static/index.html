    /* ════════════════════════════════════════════════════════════ */
    /* FA_PURE_START */
    function initialSessionState() {
      return {
        lastEventId: 0,
        revision: 0,
        session: null,
        presentation: { phase: "idle", elapsed_seconds: null, tool_count: 0, queued: 0 },
        stream: { thinking: "", content: "" },
        transcript: { blocks: [], has_older: false, before: null },
        plan: { items: [], summary: "" },
        activity: { records: [], subagents: [], totals: {} },
        pending_approval: null,
        notes: [],
        forgottenApprovalIds: {},
      };
    }

    function applySnapshot(state, snapshot) {
      const prev = state || initialSessionState();
      const forgotten = Object.assign({}, prev.forgottenApprovalIds || {});
      if (snapshot.pending_approval == null) {
        const prevId = prev.pending_approval && prev.pending_approval.id;
        if (prevId) forgotten[prevId] = true;
      } else if (snapshot.pending_approval.id) {
        delete forgotten[snapshot.pending_approval.id];
      }
      return {
        lastEventId: snapshot.sequence || 0,
        revision: snapshot.revision || 0,
        session: snapshot.session || null,
        presentation: snapshot.presentation || { phase: "idle", elapsed_seconds: null, tool_count: 0, queued: 0 },
        stream: snapshot.stream || { thinking: "", content: "" },
        transcript: snapshot.transcript || { blocks: [], has_older: false, before: null },
        plan: snapshot.plan || { items: [], summary: "" },
        activity: snapshot.activity || { records: [], subagents: [], totals: {} },
        pending_approval: snapshot.pending_approval == null ? null : snapshot.pending_approval,
        notes: [],
        forgottenApprovalIds: forgotten,
      };
    }

    function applyEvent(state, envelope) {
      const rawId = envelope && envelope.id;
      const id = rawId === 0 || rawId ? Number(rawId) : NaN;
      if (!Number.isNaN(id) && id <= state.lastEventId) {
        return state;
      }
      const next = {
        lastEventId: !Number.isNaN(id) ? id : state.lastEventId,
        revision: state.revision,
        session: state.session,
        presentation: state.presentation,
        stream: state.stream,
        transcript: state.transcript,
        plan: state.plan,
        activity: state.activity,
        pending_approval: state.pending_approval,
        notes: state.notes,
        forgottenApprovalIds: state.forgottenApprovalIds,
      };
      const type = envelope.type;
      const data = envelope.data || {};
      if (type === "note") {
        next.notes = (state.notes || []).concat([data.text]);
      } else if (type === "thinking_delta") {
        next.stream = Object.assign({}, state.stream, { thinking: data.accumulated || "" });
      } else if (type === "content_delta") {
        next.stream = Object.assign({}, state.stream, { content: data.accumulated || "" });
      } else if (type === "approval_required") {
        if (data.id && state.forgottenApprovalIds && state.forgottenApprovalIds[data.id]) {
          return next;
        }
        next.pending_approval = data;
      } else if (type === "approval_resolved") {
        next.pending_approval = null;
        if (data.id) {
          const forgotten = Object.assign({}, state.forgottenApprovalIds || {});
          forgotten[data.id] = true;
          next.forgottenApprovalIds = forgotten;
        }
      } else if (type === "todos") {
        next.plan = Object.assign({}, state.plan || {}, { items: data.items || [] });
      } else if (type === "plan") {
        next.plan = Object.assign({}, state.plan || {}, { items: data.items || [] });
      } else if (type === "activity_call") {
        const records = ((state.activity && state.activity.records) || []).concat([{
          call_id: data.call_id,
          name: data.name,
          args: data.args || {},
          state: "running",
        }]);
        next.activity = Object.assign({}, state.activity || {}, { records: records });
      } else if (type === "activity_result") {
        const records = ((state.activity && state.activity.records) || []).map((row) => {
          if (row.call_id !== data.call_id) return row;
          const copy = Object.assign({}, row);
          copy.state = data.state || (data.is_error ? "failed" : "success");
          copy.result = data.result;
          copy.ms = data.ms;
          return copy;
        });
        next.activity = Object.assign({}, state.activity || {}, { records: records });
      } else if (type === "presentation") {
        next.presentation = Object.assign({}, state.presentation || {}, data);
        if (data.phase === "interrupted") {
          const records = ((state.activity && state.activity.records) || []).map((row) => {
            if (row.state !== "running") return row;
            const copy = Object.assign({}, row);
            copy.state = "interrupted";
            return copy;
          });
          next.activity = Object.assign({}, state.activity || {}, { records: records });
        }
      } else if (type === "subagent_status") {
        next.activity = Object.assign({}, state.activity || {}, { subagents: data.snapshots || data.subagents || [] });
      } else if (type === "task_started") {
        next.plan = { items: [], summary: "" };
      }
      return next;
    }

    function parseComposerInput(text, commands, busy) {
      const raw = String(text || "").trim();
      if (!raw) {
        return { kind: "empty", spec: null, argument: "", error: "" };
      }
      if (raw.charAt(0) === "/") {
        const token = raw.split(/\s+/)[0];
        const argument = raw.slice(token.length).trim();
        const lower = token.toLowerCase();
        const list = commands || [];
        let spec = null;
        for (let i = 0; i < list.length; i++) {
          const item = list[i];
          if (String(item.name || "").toLowerCase() === lower) {
            spec = item;
            break;
          }
          const aliases = item.aliases || [];
          for (let j = 0; j < aliases.length; j++) {
            if (String(aliases[j]).toLowerCase() === lower) {
              spec = item;
              break;
            }
          }
          if (spec) break;
        }
        const error = busy && (!spec || spec.available_when_busy === false)
          ? "busy — interrupt first"
          : "";
        return { kind: "slash", spec: spec, argument: argument, error: error };
      }
      if (busy) {
        return { kind: "steer", spec: null, argument: raw, error: "" };
      }
      return { kind: "task", spec: null, argument: raw, error: "" };
    }

    function matchSlashCommands(prefix, commands) {
      const p = String(prefix || "").toLowerCase();
      const list = commands || [];
      if (!p) return list;
      const hits = [];
      for (let i = 0; i < list.length; i++) {
        const name = String(list[i].name || "").toLowerCase();
        if (name.indexOf(p) === 0) hits.push(list[i]);
      }
      return hits;
    }

    function isSlashCommand(text, commandNames) {
      const value = String(text || "");
      if (value.charAt(0) !== "/") return false;
      const head = value.split(/\s+/)[0];
      const names = commandNames || [];
      for (let i = 0; i < names.length; i++) {
        const name = typeof names[i] === "string" ? names[i] : names[i].name;
        if (name === head) return true;
      }
      return false;
    }

    function completeAtMention(fragment, attachments, workspaceFiles) {
      const f = String(fragment || "").toLowerCase();
      const pool = [];
      const pushPath = (value) => {
        if (!value) return;
        pool.push(String(value));
      };
      (attachments || []).forEach((item) => {
        if (typeof item === "string") pushPath(item);
        else pushPath(item.path || item.relative_path);
      });
      (workspaceFiles || []).forEach((item) => {
        if (typeof item === "string") pushPath(item);
        else pushPath(item && item.path);
      });
      const hits = [];
      for (let i = 0; i < pool.length; i++) {
        if (pool[i].toLowerCase().indexOf(f) === 0) hits.push(pool[i]);
      }
      let completion = hits.length ? hits[0] : "";
      if (completion.indexOf(" ") >= 0) {
        completion = '"' + completion.replace(/"/g, '\\"') + '"';
      }
      return { completion: completion, hits: hits };
    }

    function messagesToTranscriptBlocks(messages) {
      const blocks = [];
      const list = messages || [];
      for (let i = 0; i < list.length; i++) {
        const msg = list[i];
        if (msg.role === "user") {
          blocks.push({ id: msg.id, kind: "user", title: "", body: msg.content || "", collapsed: false, sourceId: msg.id });
        } else if (msg.role === "note") {
          blocks.push({
            id: msg.id,
            kind: msg.tone === "error" ? "error" : "note",
            title: msg.content || "",
            body: msg.content || "",
            collapsed: false,
            sourceId: msg.id,
          });
        } else {
          if (msg.thinking) {
            blocks.push({
              id: msg.id + ":thinking",
              kind: "thinking",
              title: "Thoughts",
              body: msg.thinking,
              collapsed: shouldCollapseThinking(msg.thinking),
              sourceId: msg.id,
            });
          }
          const tools = msg.toolCalls || [];
          for (let t = 0; t < tools.length; t++) {
            const tc = tools[t];
            blocks.push({
              id: tc.call_id || (msg.id + ":tool:" + t),
              kind: "tool",
              title: tc.name || "tool",
              body: String(tc.result || ""),
              collapsed: false,
              sourceId: msg.id,
            });
          }
          if (msg.content) {
            blocks.push({
              id: msg.id + ":report",
              kind: "report",
              title: "Final",
              body: msg.content,
              collapsed: false,
              sourceId: msg.id,
            });
          }
        }
      }
      return blocks;
    }

    function filterTranscript(blocks, mode, query) {
      const list = blocks || [];
      const q = String(query || "").toLowerCase();
      const out = [];
      for (let i = 0; i < list.length; i++) {
        const block = list[i];
        const kind = block.kind || "";
        let keep = true;
        if (mode === "tools") keep = kind === "tool";
        else if (mode === "thinking") keep = kind === "thinking";
        else if (mode === "errors") keep = kind === "error";
        else if (mode === "report") keep = kind === "report";
        else if (mode === "search") keep = true;
        if (mode === "search" || (q && mode === "all")) {
          const title = String(block.title || "").toLowerCase();
          const body = String(block.body || "").toLowerCase();
          keep = title.indexOf(q) >= 0 || body.indexOf(q) >= 0;
        }
        if (keep) out.push(block);
      }
      return out;
    }

    function withJumpToReport(state) {
      const blocks = (state && state.blocks) || [];
      let reviewId = null;
      for (let i = blocks.length - 1; i >= 0; i--) {
        if (blocks[i].kind === "report") {
          reviewId = blocks[i].id;
          break;
        }
      }
      const filter = state && state.filter;
      const incompatible = filter === "tools" || filter === "thinking" || filter === "errors";
      return {
        filter: incompatible ? "all" : (filter || "all"),
        reviewId: reviewId,
        blocks: blocks,
      };
    }

    function shouldCollapseThinking(text) {
      const value = String(text || "");
      if (value.length >= 900) return true;
      let lines = 1;
      for (let i = 0; i < value.length; i++) {
        if (value.charAt(i) === "\n") lines += 1;
      }
      return lines >= 10;
    }

    function copyReportText(blocks) {
      const list = blocks || [];
      for (let i = list.length - 1; i >= 0; i--) {
        if (list[i].kind === "report") return list[i].body || "";
      }
      return "";
    }

    function applyThemePreset(name, presets) {
      const preset = presets && presets[name];
      if (!preset || !preset.vars) return null;
      return { name: name, dark: !!preset.dark, vars: Object.assign({}, preset.vars) };
    }

    function onboardingHeadline(data, isZh) {
      const issues = (data && data.config && data.config.issues) || [];
      const blocking = issues.filter((i) => i.blocking);
      if (blocking.length === 0 && data && data.config && data.config.ok) {
        return isZh ? "配置就绪" : "Configuration ready";
      }
      return isZh ? "需要先完成配置" : "Configuration needed before first run";
    }

    function shortcutAction(e) {
      const key = String((e && e.key) || "").toLowerCase();
      if (!key) return null;
      const ctrl = !!(e && (e.ctrlKey || e.metaKey));
      if (key === "f1") return "help";
      if (key === "f2") return "settings";
      if (ctrl && key === "p") return "command_palette";
      if (e && e.metaKey && !e.ctrlKey && key === "k") return "command_palette";
      if (ctrl && key === "b") return "toggle_sidebar";
      if (ctrl && key === "o") return "toggle_files";
      if (e && e.altKey && key === "j") return "review_next";
      if (e && e.altKey && key === "k") return "review_previous";
      if (e && e.altKey && key === "enter") return "review_toggle";
      if (ctrl && key === "g") return "jump_report";
      if (ctrl && key === "y") return "copy_report";
      if (ctrl && key === ".") return "interrupt";
      if (ctrl && key === "c") {
        const hasSelection = !!(e && e.hasSelection);
        return hasSelection ? "copy" : null;
      }
      return null;
    }

    function formatSessionTitle(sess) {
      if (!sess) return "";
      if (sess.name) return String(sess.name);
      const sid = String(sess.session_id || "");
      const mode = String(sess.mode || "");
      const suffix = sid.split("-").pop() || sid.slice(-4);
      if (mode === "agent_team") return `Agent Team · ${suffix}`;
      if (mode === "react") return `ReAct · ${suffix}`;
      if (mode) return `${mode} · ${suffix}`;
      return sid.slice(-10) || "Session";
    }

    function reconnectPlan(info) {
      const lastEventId = (info && info.lastEventId) || 0;
      const snapshotRequired = !!(info && info.snapshotRequired);
      if (snapshotRequired) return { mode: "snapshot", lastEventId: 0 };
      return { mode: "replay", lastEventId: lastEventId };
    }

    // Rehydrate structured snapshot blocks into card-ready messages:
    // consecutive tool blocks + the trailing text merge into ONE assistant
    // message (toolCalls + final content), mirroring the live turn_complete
    // shape so ThinkingTrace/ToolChipRow/markdown rendering is identical.
    function blocksToMessages(blocks) {
      const out = [];
      let pending = null;
      const flush = () => { if (pending) { out.push(pending); pending = null; } };
      for (const b of blocks || []) {
        const kind = b.kind || (b.role === "user" ? "user" : "text");
        if (kind === "user") {
          flush();
          out.push({ id: b.id, role: "user", content: b.content || "", timestamp: 0 });
          continue;
        }
        if (kind === "tool") {
          if (!pending) pending = { id: b.id, role: "assistant", content: "", toolCalls: [], timestamp: 0 };
          pending.toolCalls.push({
            call_id: b.call_id || b.id,
            name: b.name || "tool",
            args: b.args || {},
            result: b.content || "",
            duration_ms: b.duration_ms != null ? b.duration_ms : null,
            is_error: !!b.is_error,
            status: "completed",
          });
          continue;
        }
        if (kind === "thinking") {
          if (!pending) pending = { id: b.id, role: "assistant", content: "", toolCalls: [], timestamp: 0 };
          if (b.content) pending.thinking = pending.thinking ? pending.thinking + "\n\n" + b.content : b.content;
          continue;
        }
        if (!pending) pending = { id: b.id, role: "assistant", content: "", toolCalls: [], timestamp: 0 };
        if (b.content) pending.content = pending.content ? pending.content + "\n\n" + b.content : b.content;
      }
      flush();
      return out;
    }
    /* FA_PURE_END */

    function OnboardingPanel({ data, isZh, onDismiss, onRecheck }) {
      const probe = (data && data.probe) || {};
      const cfg = (data && data.config) || {};
      const blocking = (cfg.issues || []).filter((issue) => issue.blocking);
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4 backdrop-blur-sm">
          <div className="anim-pop-in max-h-[85vh] w-full max-w-lg overflow-y-auto rounded-[10px] p-5"
               style={{ backgroundColor: "var(--surface)", boxShadow: "var(--shadow-overlay)" }}>
            <h3 className="text-[13.5px] font-semibold" style={{ color: "var(--ink)" }}>{onboardingHeadline(data, isZh)}</h3>
            <p className="mt-1 text-[11.5px]" style={{ color: "var(--ink-3)" }}>
              {isZh ? "以下探测信息只含变量名与主机名，绝不含密钥值。" : "Probe facts below carry variable names and hosts only — never key values."}
            </p>

            <div className="mono mt-3 space-y-1 rounded-lg p-3 text-[11px]" style={{ backgroundColor: "var(--inset)", color: "var(--ink-2)" }}>
              <div>{isZh ? "提供商" : "provider"}: {cfg.provider || "—"}</div>
              <div>{isZh ? "模型" : "model"}: {cfg.model || "—"}</div>
              <div>{isZh ? "端点" : "endpoint"}: {cfg.endpoint_host || "default"}</div>
              <div>
                {isZh ? "密钥" : "API key"}: {cfg.api_key_env ? `${cfg.api_key_env} ${cfg.api_key_configured ? "✓" : "✗"}` : (isZh ? "未配置" : "not set")}
              </div>
              {(probe.configured_key_vars || []).length > 0 && (
                <div>{isZh ? "已配置密钥变量" : "configured key vars"}: {(probe.configured_key_vars || []).join(", ")}</div>
              )}
              {probe.env_path && <div>{isZh ? "环境文件" : "env file"}: {probe.env_path}</div>}
            </div>

            {blocking.length > 0 && (
              <div className="mt-3 space-y-1.5">
                <div className="text-[11px] font-semibold uppercase tracking-wider" style={{ color: "var(--ink-3)" }}>
                  {isZh ? "待解决" : "Blocking issues"}
                </div>
                {blocking.map((issue) => (
                  <div key={issue.code} className="rounded-lg px-3 py-2 text-[11.5px]" style={{ backgroundColor: "var(--red-tint)", color: "var(--red)" }}>
                    {issue.message}{issue.env_var ? ` (${issue.env_var})` : ""}
                  </div>
                ))}
              </div>
            )}

            <div className="mt-4 flex justify-between gap-2">
              <button type="button" onClick={onRecheck} className="cursor-pointer rounded-lg px-3 py-1.5 text-[12px]" style={{ backgroundColor: "var(--field)", border: "none", color: "var(--ink)" }}>
                {isZh ? "重新检测" : "Re-check"}
              </button>
              <button type="button" onClick={onDismiss} className="cursor-pointer rounded-lg px-3 py-1.5 text-[12px] font-medium" style={{ backgroundColor: "var(--accent)", border: "none", color: "#fff" }}>
                {isZh ? "仍然进入" : "Continue anyway"}
              </button>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [isDark, setIsDark] = useState(() => {
        if (typeof window !== "undefined") {
          const saved = localStorage.getItem("fa_theme");
          if (saved !== null) return saved === "dark";
          return getSystemDark();
        }
        return false;
      });
      const [isZh, setIsZh] = useState(() => {
        if (typeof window !== "undefined") {
          const saved = localStorage.getItem("fa_lang");
          if (saved !== null) return saved === "zh";
        }
        return true;
      });

      const [status, setStatus] = useState(null);
      const [connected, setConnected] = useState(false);
      const [activeMode, setActiveMode] = useState("react");
      const [isBusy, setIsBusy] = useState(false);

      // Theme presets + onboarding (config not ok → guidance overlay).
      // A preset applies only when the user picked one HERE (fa_theme_chosen);
      // otherwise the page follows the system light/dark preference.
      const [themeName, setThemeName] = useState(() => {
        if (typeof window === "undefined") return "";
        if (localStorage.getItem("fa_theme_chosen") !== "1") {
          // Migration: drop values written by the old server-auto-adoption
          localStorage.removeItem("fa_theme_name");
          return "";
        }
        return localStorage.getItem("fa_theme_name") || "";
      });
      const [themePresets, setThemePresets] = useState(null);
      const [themeOptions, setThemeOptions] = useState([]);
      const appliedThemeVarsRef = useRef([]);
      const [onboarding, setOnboarding] = useState(null);

      // Layout & modals
      const [showLeftSidebar, setShowLeftSidebar] = useState(true);
      const [showRightSidebar, setShowRightSidebar] = useState(true);
      const [mobileNavOpen, setMobileNavOpen] = useState(false);
      const [mobilePanelsOpen, setMobilePanelsOpen] = useState(false);
      const [rightTab, setRightTab] = useState("files");
      const [planItems, setPlanItems] = useState([]);
      const [activityRecords, setActivityRecords] = useState([]);
      const [isWorkspaceModalOpen, setIsWorkspaceModalOpen] = useState(false);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [commands, setCommands] = useState([]);
      const [paletteOpen, setPaletteOpen] = useState(false);
      const [paletteQuery, setPaletteQuery] = useState("");
      const [helpOpen, setHelpOpen] = useState(false);
      const [leftSession, setLeftSession] = useState(false);
      const [attachedFiles, setAttachedFiles] = useState([]);
      const inputHistoryRef = useRef([]);
      const historyIndexRef = useRef(-1);
      const historyDraftRef = useRef("");
      const fileInputRef = useRef(null);

      // Conversation & live stream
      const [messages, setMessages] = useState([]);
      const [inputPrompt, setInputPrompt] = useState("");
      const [activeThinking, setActiveThinking] = useState("");
      const [activeContent, setActiveContent] = useState("");
      const [activeToolCalls, setActiveToolCalls] = useState([]);
      const [pendingApproval, setPendingApproval] = useState(null);
      const [feedbackText, setFeedbackText] = useState("");

      // Agent-philosophy state: task board, subagents, timers, usage
      const [board, setBoard] = useState([]);
      const [subagents, setSubagents] = useState([]);
      const [taskStartedAt, setTaskStartedAt] = useState(null);
      const [thinkingStartedAt, setThinkingStartedAt] = useState(null);
      const [nowTick, setNowTick] = useState(Date.now());
      const [usageLive, setUsageLive] = useState(null);
      const [steerFlash, setSteerFlash] = useState("");

      // Workspace & history data
      const [workspaces, setWorkspaces] = useState([]);
      const [activeCwd, setActiveCwd] = useState("");
      const [diffData, setDiffData] = useState(null);
      const [revertReport, setRevertReport] = useState(null);
      const [artifacts, setArtifacts] = useState([]);
      const [savedSessions, setSavedSessions] = useState([]);
      const [showArchived, setShowArchived] = useState(false);
      const [sessionQuery, setSessionQuery] = useState("");
      const [openMenuSessionId, setOpenMenuSessionId] = useState(null);
      const [inspectSession, setInspectSession] = useState(null);
      const [previewFile, setPreviewFile] = useState(null);
      const [revertArmed, setRevertArmed] = useState(false);
      const [transcriptFilter, setTranscriptFilter] = useState("all");
      const [transcriptQuery, setTranscriptQuery] = useState("");
      const [reviewId, setReviewId] = useState(null);
      const [followTail, setFollowTail] = useState(true);
      const [hasOlder, setHasOlder] = useState(false);
      const [olderCursor, setOlderCursor] = useState(null);

      const chatContainerRef = useRef(null);
      const activeContentRef = useRef("");
      const activeThinkingRef = useRef("");
      const activeToolCallsRef = useRef([]);
      const thinkingStartedAtRef = useRef(null);
      const descMapRef = useRef({}); // truncated board desc → full desc from add_task args

      activeContentRef.current = activeContent;
      activeThinkingRef.current = activeThinking;
      activeToolCallsRef.current = activeToolCalls;
      thinkingStartedAtRef.current = thinkingStartedAt;

      const scrollToBottom = useCallback(() => {
        if (!followTail || !chatContainerRef.current) return;
        chatContainerRef.current.scrollTop = chatContainerRef.current.scrollHeight;
      }, [followTail]);

      const jumpToLatest = useCallback(() => {
        setFollowTail(true);
        const el = chatContainerRef.current;
        if (el) el.scrollTop = el.scrollHeight;
      }, []);

      // Elapsed-time ticker — time is visible
      useEffect(() => {
        if (!isBusy && !activeThinking) return;
        const t = setInterval(() => setNowTick(Date.now()), 1000);
        return () => clearInterval(t);
      }, [isBusy, activeThinking]);

      useEffect(() => {
        document.documentElement.classList.toggle("dark", isDark);
      }, [isDark]);

      // Focus returns to the composer once every dialog closes
      const anyDialogOpen = paletteOpen || helpOpen || isSettingsOpen || leftSession
        || !!onboarding || isWorkspaceModalOpen || !!previewFile || !!inspectSession;
      const composerFocusArmedRef = useRef(false);
      useEffect(() => {
        if (anyDialogOpen) {
          composerFocusArmedRef.current = true;
          return;
        }
        if (!composerFocusArmedRef.current) return;
        composerFocusArmedRef.current = false;
        const el = document.getElementById("fa-composer");
        if (el) el.focus();
      }, [anyDialogOpen]);

      // A named preset overrides the native light/dark stylesheet inline;
      // an empty name clears the overrides and returns to isDark.
      useEffect(() => {
        const root = document.documentElement;
        for (const key of appliedThemeVarsRef.current) root.style.removeProperty(key);
        appliedThemeVarsRef.current = [];
        const applied = themeName && themePresets ? applyThemePreset(themeName, themePresets) : null;
        if (applied) {
          root.classList.toggle("dark", applied.dark);
          for (const [key, value] of Object.entries(applied.vars)) {
            root.style.setProperty(key, value);
            appliedThemeVarsRef.current.push(key);
          }
        } else {
          root.classList.toggle("dark", isDark);
        }
      }, [themeName, themePresets, isDark]);

      useEffect(() => {
        if (typeof window === "undefined" || !window.matchMedia) return;
        const media = window.matchMedia("(prefers-color-scheme: dark)");
        const handler = (e) => {
          const saved = localStorage.getItem("fa_theme");
          if (saved === null) setIsDark(e.matches);
        };
        media.addEventListener("change", handler);
        return () => media.removeEventListener("change", handler);
      }, []);

      useEffect(() => {
        safeFetch("/api/capabilities").then(async (res) => {
          if (res && res.ok) {
            try {
              const data = await res.json();
              setCommands(data.commands || []);
            } catch {}
          }
        });
      }, []);

      // Theme presets (server is the source of truth for TUI palettes)
      useEffect(() => {
        safeFetch("/api/themes").then(async (res) => {
          if (res && res.ok) {
            try {
              const data = await res.json();
              setThemePresets(data.themes || null);
              setThemeOptions(data.picker || Object.keys(data.themes || {}));
            } catch {}
          }
        });
      }, []);

      // Runtime config: swap in the onboarding guidance overlay when the
      // config is not usable yet. The server-persisted UserSettings.theme is
      // NOT auto-applied — it cannot be told apart from its default value,
      // and forcing it broke system light/dark following. A preset is applied
      // only from an explicit pick (selectTheme), which persists it.
      useEffect(() => {
        (async () => {
          const res = await safeFetch("/api/config");
          if (!res || !res.ok) return;
          try {
            const cfg = await res.json();
            if (cfg.ok === false) {
              const ob = await safeFetch("/api/onboarding");
              if (ob && ob.ok) setOnboarding(await ob.json());
            }
          } catch {}
        })();
      }, []);

      const postSessionAction = async (action, args) => {
        return safeFetch("/api/actions", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action, arguments: args || {} }),
        });
      };

      const toggleTheme = () => {
        if (themeName) {
          // A preset is active — the toggle returns to native light/dark
          selectTheme("");
          return;
        }
        const next = !isDark;
        setIsDark(next);
        if (typeof window !== "undefined") localStorage.setItem("fa_theme", next ? "dark" : "light");
      };
      const selectTheme = (name) => {
        setThemeName(name);
        if (typeof window !== "undefined") {
          if (name) {
            localStorage.setItem("fa_theme_name", name);
            localStorage.setItem("fa_theme_chosen", "1");
          } else {
            // Back to Auto: follow the system again (drop the binary pick too)
            localStorage.removeItem("fa_theme_name");
            localStorage.removeItem("fa_theme_chosen");
            localStorage.removeItem("fa_theme");
            setIsDark(getSystemDark());
          }
        }
        if (name) postSessionAction("set_theme", { name });
      };
      const toggleLang = () => {
        const next = !isZh;
        setIsZh(next);
        if (typeof window !== "undefined") localStorage.setItem("fa_lang", next ? "zh" : "en");
      };

      const safeFetch = async (url, options) => {
        try { return await fetch(url, options); } catch { return null; }
      };

      const refreshStatus = useCallback(async () => {
        const res = await safeFetch("/api/status");
        if (res && res.ok) {
          try {
            const data = await res.json();
            setStatus(data);
            setActiveMode(data.mode);
            setActiveCwd(data.cwd || "");
            setIsBusy(data.status === "running");
            setConnected(true);
            return;
          } catch {}
        }
        setConnected(false);
      }, []);

      const refreshWorkspace = useCallback(async () => {
        let diff = null;
        const [diffRes, artRes, sessRes, wsRes] = await Promise.all([
          safeFetch("/api/diff"),
          safeFetch("/api/artifacts"),
          safeFetch("/api/sessions"),
          safeFetch("/api/workspaces"),
        ]);
        if (diffRes && diffRes.ok) { try { diff = await diffRes.json(); setDiffData(diff); } catch {} }
        if (artRes && artRes.ok) {
          try {
            const a = await artRes.json();
            setArtifacts(a.artifacts || []);
          } catch {}
        }
        if (sessRes && sessRes.ok) { try { const s = await sessRes.json(); setSavedSessions(s.sessions || []); } catch {} }
        if (wsRes && wsRes.ok) {
          try {
            const w = await wsRes.json();
            setWorkspaces(w.workspaces || []);
            if (w.active_cwd) setActiveCwd(w.active_cwd);
          } catch {}
        }
        const attRes = await safeFetch("/api/attachments");
        if (attRes && attRes.ok) {
          try { const a = await attRes.json(); setAttachedFiles(a.attachments || []); } catch {}
        }
        return diff;
      }, []);

      const handleOpenPreview = async (filePath) => {
        if (!filePath) return;
        const res = await safeFetch(`/api/file?path=${encodeURIComponent(filePath)}`);
        if (res && res.ok) { try { setPreviewFile(await res.json()); } catch {} }
      };

      const resetStreamState = () => {
        setMessages([]);
        setActiveThinking("");
        setActiveContent("");
        setActiveToolCalls([]);
        setBoard([]);
        setSubagents([]);
        setPendingApproval(null);
        setSteerFlash("");
        setTaskStartedAt(null);
        setThinkingStartedAt(null);
        descMapRef.current = {};
      };

      /* ── Workspace actions ── */
      const handleAddWorkspace = async (path) => {
        try {
          const res = await fetch("/api/workspaces/add", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ path }),
          });
          if (res.ok) {
            await refreshWorkspace();
            return { ok: true };
          }
          const errData = await res.json().catch(() => ({}));
          return { ok: false, error: errData.detail || (isZh ? "添加失败，请确认路径有效" : "Failed to add workspace") };
        } catch (e) {
          return { ok: false, error: String(e) };
        }
      };

      const handleRemoveWorkspace = async (path) => {
        const res = await safeFetch("/api/workspaces/remove", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ path }),
        });
        if (res && res.ok) refreshWorkspace();
      };

      const handleSelectWorkspace = async (path) => {
        if (isBusy) return;
        const res = await safeFetch("/api/workspaces/select", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ path }),
        });
        if (res && res.ok) {
          resetStreamState();
          refreshStatus();
          refreshWorkspace();
          setIsWorkspaceModalOpen(false);
        }
      };

      const handleCreateNewSession = async (mode = "react") => {
        if (isBusy) return;
        const res = await safeFetch("/api/sessions/new", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ mode }),
        });
        if (res && res.ok) {
          const data = await res.json();
          setActiveMode(data.mode);
          resetStreamState();
          refreshStatus();
          refreshWorkspace();
        }
      };

      const handleResumeSession = async (sessionId) => {
        if (isBusy) return;
        const res = await safeFetch(`/api/sessions/${sessionId}/resume`, { method: "POST" });
        if (res && res.ok) {
          const data = await res.json();
          setActiveMode(data.mode);
          refreshStatus();
          const detailRes = await safeFetch(`/api/sessions/${sessionId}`);
          if (detailRes && detailRes.ok) {
            const detail = await detailRes.json();
            const state = detail.state || {};
            const display = state.display_history || [];
            const restoredMsgs = [];
            for (let i = 0; i < display.length; i++) {
              const item = display[i];
              if (item.role === "user") {
                restoredMsgs.push({
                  id: `hist-u-${i}`,
                  role: "user",
                  content: item.content || (Array.isArray(item.content) ? item.content.map(c => c.text).join("\n") : ""),
                });
              } else if (item.role === "assistant") {
                restoredMsgs.push({
                  id: `hist-a-${i}`,
                  role: "assistant",
                  content: item.content || "",
                  thinking: item.thinking || "",
                  toolCalls: (item.tool_calls || []).map(tc => ({
                    call_id: tc.id || `tc-${i}`,
                    name: tc.function?.name || tc.name || "tool",
                    args: typeof tc.function?.arguments === "string" ? JSON.parse(tc.function.arguments || "{}") : tc.args || {},
                    status: "completed",
                  })),
                });
              }
            }
            resetStreamState();
            setMessages(restoredMsgs);
          }
          refreshWorkspace();
          setInspectSession(null);
        }
      };

      const handleInspectSession = async (sessionId) => {
        const res = await safeFetch(`/api/sessions/${sessionId}`);
        if (res && res.ok) { try { setInspectSession(await res.json()); } catch {} }
      };

      const handleArchiveSession = async (sessionId, archived = true) => {
        const res = await safeFetch(`/api/sessions/${sessionId}/archive`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ archived }),
        });
        if (res && res.ok) {
          refreshWorkspace();
          if (inspectSession && inspectSession.session_id === sessionId) {
            setInspectSession((prev) => (prev ? { ...prev, state: { ...(prev.state || {}), archived } } : null));
          }
        }
      };

      const handleDeleteSession = async (sessionId) => {
        const confirmMsg = isZh
          ? "确定要彻底删除该会话及其所有运行记录吗？此操作无法撤销。"
          : "Are you sure you want to permanently delete this session and all its run records? This action cannot be undone.";
        if (!window.confirm(confirmMsg)) return;

        const res = await safeFetch(`/api/sessions/${sessionId}`, { method: "DELETE" });
        if (res && res.ok) {
          const data = await res.json().catch(() => ({}));
          refreshWorkspace();
          if (inspectSession && inspectSession.session_id === sessionId) {
            setInspectSession(null);
          }
          if (data.active_reset || (status && status.session_id === sessionId)) {
            resetStreamState();
            refreshStatus();
          }
        }
      };

      const handlePinSession = async (sessionId, pinned) => {
        setSavedSessions((prev) => prev.map((s) => (s.session_id === sessionId ? { ...s, pinned } : s)));
        await safeFetch(`/api/sessions/${sessionId}/pin`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pinned }),
        });
        refreshWorkspace();
      };

      const handleRenameSession = async (sessionId, name) => {
        setSavedSessions((prev) => prev.map((s) => (s.session_id === sessionId ? { ...s, name } : s)));
        const res = await postSessionAction("rename_session", { session_id: sessionId, name });
        if (!res || !res.ok) pushNote(isZh ? "重命名失败" : "Rename failed", "warn");
        refreshWorkspace();
      };

      const pushNote = useCallback((text, tone) => {
        setMessages((prev) => [...prev, { id: `note-${Date.now()}-${prev.length}`, role: "note", content: text, tone: tone || "info", timestamp: Date.now() }]);
      }, []);

      /* ── SSE wiring — snapshot first, then named events ── */
      useEffect(() => {
        let cancelled = false;
        let es = null;
        let sessionState = initialSessionState();

        const hydrate = (snap) => {
          sessionState = applySnapshot(sessionState, snap);
          if (snap.session) {
            if (snap.session.mode) setActiveMode(snap.session.mode);
            if (snap.session.cwd) setActiveCwd(snap.session.cwd);
          }
          if (snap.runtime && snap.runtime.status) {
            setIsBusy(snap.runtime.status === "running");
          }
          setPendingApproval(snap.pending_approval || null);
          if (snap.stream) {
            setActiveThinking(snap.stream.thinking || "");
            setActiveContent(snap.stream.content || "");
          }
          if (snap.transcript && Array.isArray(snap.transcript.blocks)) {
            setMessages(blocksToMessages(snap.transcript.blocks));
            setHasOlder(!!snap.transcript.has_older);
            setOlderCursor(snap.transcript.before || null);
          }
        };

        const interval = setInterval(refreshStatus, 8000);

        (async () => {
          refreshStatus();
          refreshWorkspace();
          let lastEventId = 0;
          const res = await safeFetch("/api/state");
          if (cancelled) return;
          if (res && res.ok) {
            try {
              const snap = await res.json();
              hydrate(snap);
              lastEventId = sessionState.lastEventId || 0;
            } catch {}
          }
          if (cancelled) return;
          try {
            const url = lastEventId ? `/api/events?last_event_id=${lastEventId}` : "/api/events";
            es = new EventSource(url);
            const _add = es.addEventListener.bind(es);
            es.addEventListener = (name, fn) => {
              _add(name, (e) => {
                if (name !== "connected" && name !== "snapshot_required") {
                  const id = e.lastEventId ? Number(e.lastEventId) : NaN;
                  if (!Number.isNaN(id) && id <= sessionState.lastEventId) return;
                  try {
                    const payload = JSON.parse(e.data);
                    const prevPending = sessionState.pending_approval;
                    sessionState = applyEvent(sessionState, {
                      id: Number.isNaN(id) ? null : id,
                      type: payload.type || name,
                      data: payload.data,
                      timestamp: payload.timestamp,
                    });
                    if (name === "approval_required" && sessionState.pending_approval === prevPending) return;
                    if (sessionState.plan) setPlanItems(sessionState.plan.items || []);
                    if (sessionState.activity) {
                      setActivityRecords(sessionState.activity.records || []);
                      if (sessionState.activity.subagents) setSubagents(sessionState.activity.subagents);
                    }
                  } catch {}
                }
                fn(e);
              });
            };
            es.onopen = () => setConnected(true);
            es.onerror = () => setConnected(false);

            es.addEventListener("snapshot_required", async () => {
              const plan = reconnectPlan({ lastEventId: sessionState.lastEventId, snapshotRequired: true });
              if (plan.mode !== "snapshot") return;
              const snapRes = await safeFetch("/api/state");
              if (!snapRes || !snapRes.ok || cancelled) return;
              try { hydrate(await snapRes.json()); } catch {}
            });

          es.addEventListener("connected", () => { setConnected(true); refreshStatus(); });

          es.addEventListener("status", (e) => {
            try {
              const payload = JSON.parse(e.data);
              const state = payload.data?.state;
              if (state === "running" || state === "thinking") setIsBusy(true);
              refreshStatus();
            } catch {}
          });

          es.addEventListener("task_started", () => {
            setIsBusy(true);
            setTaskStartedAt(Date.now());
            setBoard([]);
            setSubagents([]);
            setActiveThinking("");
            setActiveContent("");
            setActiveToolCalls([]);
            setSteerFlash("");
            setThinkingStartedAt(null);
            descMapRef.current = {};
          });

          es.addEventListener("session_resumed", (e) => {
            try {
              const payload = JSON.parse(e.data);
              if (payload.data?.mode) setActiveMode(payload.data.mode);
              refreshStatus();
              refreshWorkspace();
            } catch {}
          });

          es.addEventListener("session_created", (e) => {
            try {
              const payload = JSON.parse(e.data);
              if (payload.data?.mode) setActiveMode(payload.data.mode);
              refreshStatus();
              refreshWorkspace();
            } catch {}
          });

          es.addEventListener("cleared", () => { resetStreamState(); });

          es.addEventListener("mode_changed", (e) => {
            try {
              const payload = JSON.parse(e.data);
              if (payload.data?.mode) setActiveMode(payload.data.mode);
            } catch {}
          });

          es.addEventListener("workspaces_updated", () => { refreshWorkspace(); });

          es.addEventListener("sessions_updated", () => { refreshWorkspace(); });

          es.addEventListener("workspace_changed", () => {
            resetStreamState();
            refreshStatus();
            refreshWorkspace();
          });

          es.addEventListener("thinking_delta", (e) => {
            try {
              const payload = JSON.parse(e.data);
              setThinkingStartedAt((prev) => (prev == null ? Date.now() : prev));
              setActiveThinking(payload.data?.accumulated || "");
              scrollToBottom();
            } catch {}
          });

          es.addEventListener("content_delta", (e) => {
            try {
              const payload = JSON.parse(e.data);
              setActiveContent(payload.data?.accumulated || "");
              scrollToBottom();
            } catch {}
          });

          es.addEventListener("turn_fallback", (e) => {
            try {
              const payload = JSON.parse(e.data);
              if (payload.data?.text) setActiveContent(payload.data.text);
              if (payload.data?.thinking) {
                setThinkingStartedAt((prev) => (prev == null ? Date.now() : prev));
                setActiveThinking(payload.data.thinking);
              }
              scrollToBottom();
            } catch {}
          });

          es.addEventListener("turn_complete", (e) => {
            try {
              const payload = JSON.parse(e.data);
              const text = payload.data?.text || activeContentRef.current;
              const thinking = payload.data?.thinking || activeThinkingRef.current;
              const toolCalls = [...activeToolCallsRef.current];
              const thinkingMs = thinkingStartedAtRef.current != null ? Date.now() - thinkingStartedAtRef.current : null;

              if (text || thinking || toolCalls.length > 0) {
                setMessages((prev) => [
                  ...prev,
                  { id: `msg-${Date.now()}-${prev.length}`, role: "assistant", content: text, thinking, thinkingMs, toolCalls, timestamp: Date.now() },
                ]);
              }
              setActiveContent("");
              setActiveThinking("");
              setActiveToolCalls([]);
              setThinkingStartedAt(null);
              refreshWorkspace();
              scrollToBottom();
            } catch {}
          });

          es.addEventListener("tool_call", (e) => {
            try {
              const payload = JSON.parse(e.data);
              const item = payload.data;
              // Keep full add_task descriptions for the board projection
              if (item.name === "add_task" && Array.isArray(item.args?.tasks)) {
                for (const raw of item.args.tasks) {
                  const desc = typeof raw === "object" && raw ? String(raw.description || "") : String(raw || "");
                  if (desc) descMapRef.current[desc.slice(0, 80).trim()] = desc;
                }
              }
              setActiveToolCalls((prev) => {
                const idx = prev.findIndex((c) => c.call_id === item.call_id);
                if (idx >= 0) {
                  const next = [...prev];
                  next[idx] = { ...next[idx], ...item };
                  return next;
                }
                return [...prev, item];
              });
              scrollToBottom();
            } catch {}
          });

          es.addEventListener("tool_result", (e) => {
            try {
              const payload = JSON.parse(e.data);
              const item = payload.data;
              setActiveToolCalls((prev) =>
                prev.map((c) =>
                  c.call_id === item.call_id || c.name === item.name
                    ? { ...c, result: item.result, duration_ms: item.duration_ms, is_error: item.is_error, status: item.is_error ? "error" : "completed" }
                    : c
                )
              );
              // Task board projection — the rendered board in the result is authoritative
              if ((item.name === "add_task" || item.name === "update_task") && !item.is_error) {
                const rows = parseBoardText(item.result);
                if (rows) setBoard(rows);
              }
              refreshWorkspace();
              scrollToBottom();
            } catch {}
          });

          // Proposed-edit previews ride alongside the tool call — attach to the latest diff-tool chip
          es.addEventListener("diff_preview", (e) => {
            try {
              const payload = JSON.parse(e.data);
              const diff = payload.data?.diff;
              if (!diff) return;
              setActiveToolCalls((prev) => {
                const next = [...prev];
                for (let i = next.length - 1; i >= 0; i--) {
                  if (["write_file", "file_editor_create", "file_editor_str_replace"].includes(next[i].name)) {
                    next[i] = { ...next[i], preview: diff, preview_kind: "diff" };
                    break;
                  }
                }
                return next;
              });
            } catch {}
          });

          es.addEventListener("approval_required", (e) => {
            try {
              const payload = JSON.parse(e.data);
              setPendingApproval(payload.data);
              scrollToBottom();
            } catch {}
          });

          es.addEventListener("approval_resolved", () => {
            setPendingApproval(null);
            setFeedbackText("");
          });

          // Audit trail: policy blocks, redirects, rejections, queue notices
          es.addEventListener("note", (e) => {
            try {
              const payload = JSON.parse(e.data);
              const text = payload.data?.text || "";
              if (!text) return;
              let tone = "info";
              if (text.startsWith("[error]") || text.startsWith("!") || text.startsWith("Error:")) tone = "error";
              else if (text.startsWith("->") || text.startsWith("=>")) tone = "accent";
              else if (text.toLowerCase().includes("warning")) tone = "warn";
              pushNote(text, tone);
              scrollToBottom();
            } catch {}
          });

          es.addEventListener("error", (e) => {
            try {
              const payload = JSON.parse(e.data);
              const text = payload.data?.message || payload.data?.text || "Unknown error";
              pushNote(text, "error");
              scrollToBottom();
            } catch {}
          });

          es.addEventListener("steer_injected", (e) => {
            try {
              const payload = JSON.parse(e.data);
              const instruction = payload.data?.instruction || "";
              pushNote(`↳ ${isZh ? "已注入干预指令" : "steer queued"}: ${instruction}`, "accent");
              setSteerFlash(instruction);
              setTimeout(() => setSteerFlash(""), 4000);
              scrollToBottom();
            } catch {}
          });

          es.addEventListener("usage", (e) => {
            try {
              const payload = JSON.parse(e.data);
              setUsageLive(payload.data || null);
            } catch {}
          });

          es.addEventListener("subagent_status", (e) => {
            try {
              const payload = JSON.parse(e.data);
              if (payload.data?.snapshots) {
                setSubagents(
                  payload.data.snapshots.map((s, idx) => ({
                    id: s.id || `sub-${idx}`,
                    name: s.name || s.role || `Agent ${idx + 1}`,
                    role: s.role || "Specialist",
                    status: s.status || "running",
                    action: s.action || s.current_action || "",
                    logs: s.logs || [],
                    tokens: s.tokens,
                    duration: s.duration,
                  }))
                );
              }
            } catch {}
          });

          es.addEventListener("final_answer", async (e) => {
            try {
              const payload = JSON.parse(e.data);
              const finalContent = payload.data?.text || activeContentRef.current;
              if (finalContent) {
                setMessages((prev) => {
                  // The final turn's turn_complete often carries the same text — don't duplicate it
                  const last = prev[prev.length - 1];
                  if (last && last.role === "assistant" && last.content === finalContent) return prev;
                  return [
                    ...prev,
                    {
                      id: `final-${Date.now()}`, role: "assistant", content: finalContent,
                      thinking: activeThinkingRef.current,
                      toolCalls: [...activeToolCallsRef.current], timestamp: Date.now(),
                    },
                  ];
                });
              }
              setActiveContent("");
              setActiveThinking("");
              setActiveToolCalls([]);
              setThinkingStartedAt(null);
              setIsBusy(false);
              refreshStatus();
              const freshDiff = await refreshWorkspace();
              // Task finished: surface what changed — Diff when there are edits, Files otherwise
              if (freshDiff && ((freshDiff.stats || []).length || (freshDiff.diff || "").length)) setRightTab("diff");
              else setRightTab("files");
              scrollToBottom();
            } catch {}
          });

          es.addEventListener("task_cancelled", () => {
            pushNote(isZh ? "■ 任务已被用户中断" : "■ Task interrupted by user", "warn");
          });

          es.addEventListener("task_ended", () => {
            setIsBusy(false);
            setTaskStartedAt(null);
            refreshStatus();
            refreshWorkspace();
          });
          } catch {
            setConnected(false);
          }
        })();

        return () => {
          cancelled = true;
          if (es) es.close();
          clearInterval(interval);
        };
      }, [refreshStatus, refreshWorkspace, scrollToBottom, pushNote, isZh]);

      /* ── Actions ── */
      const handleSend = async () => {
        if (!inputPrompt.trim() || isBusy) return;
        const text = inputPrompt.trim();
        setInputPrompt("");
        setMessages((prev) => [...prev, { id: `user-${Date.now()}`, role: "user", content: text, timestamp: Date.now() }]);
        setIsBusy(true);
        setTaskStartedAt(Date.now());

        const res = await safeFetch("/api/run", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: text, mode: activeMode }),
        });
        if (!res || !res.ok) setIsBusy(false);
        setTimeout(scrollToBottom, 50);
      };

      const handleSteer = async () => {
        if (!inputPrompt.trim()) return;
        const text = inputPrompt.trim();
        setInputPrompt("");
        await safeFetch("/api/steer", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ instruction: text }),
        });
      };

      const slashActionArgs = (action, argument) => {
        if (action === "rename_session") return { name: argument };
        if (action === "resume_session") return { session_id: argument };
        if (action === "switch_workflow") return { mode: argument };
        if (action === "switch_model") return { model: argument };
        if (action === "change_cwd") return { path: argument };
        return {};
      };

      const uploadFiles = async (fileList) => {
        if (!fileList || !fileList.length) return;
        const body = new FormData();
        for (const file of fileList) body.append("files", file);
        const res = await safeFetch("/api/attachments/upload", { method: "POST", body });
        if (res && res.ok) refreshWorkspace();
      };

      const handleComposerSubmit = async () => {
        const text = inputPrompt.trim();
        if (!text) return;
        const parsed = parseComposerInput(text, commands, isBusy);
        if (parsed.kind === "empty") return;
        if (parsed.kind === "slash") {
          if (parsed.error) {
            pushNote(parsed.error, "warn");
            return;
          }
          setInputPrompt("");
          const name = parsed.spec && parsed.spec.name;
          if (name === "/help") { setHelpOpen(true); return; }
          if (name === "/settings") { setIsSettingsOpen(true); return; }
          if (name === "/exit") { setLeftSession(true); return; }
          if (name === "/filter") {
            const mode = (parsed.argument || "all").toLowerCase();
            setTranscriptFilter(["all", "thinking", "tools", "errors", "report"].indexOf(mode) >= 0 ? mode : "all");
            return;
          }
          if (name === "/find") { setTranscriptQuery(parsed.argument); return; }
          if (name === "/report") {
            const jumped = withJumpToReport({ filter: transcriptFilter, blocks: messagesToTranscriptBlocks(messages) });
            setTranscriptFilter(jumped.filter);
            setReviewId(jumped.reviewId);
            return;
          }
          if (name === "/copy") {
            const text = copyReportText(messagesToTranscriptBlocks(messages));
            if (text && navigator.clipboard) navigator.clipboard.writeText(text);
            return;
          }
          if (parsed.spec && parsed.spec.action) {
            const res = await postSessionAction(parsed.spec.action, slashActionArgs(parsed.spec.action, parsed.argument));
            if (res && res.ok) {
              refreshStatus();
              refreshWorkspace();
            } else if (res && res.status === 409) {
              pushNote("busy — interrupt first", "warn");
            }
          }
          return;
        }
        if (parsed.kind === "steer") {
          await handleSteer();
          return;
        }
        await handleSend();
      };

      const handleApproval = async (decision, confirmation = "") => {
        if (!pendingApproval) return;
        await safeFetch("/api/approve", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            id: pendingApproval.id,
            decision,
            feedback: feedbackText,
            confirmation,
          }),
        });
        setPendingApproval(null);
        setFeedbackText("");
      };

      const handleInterrupt = async () => {
        await safeFetch("/api/interrupt", { method: "POST" });
        setIsBusy(false);
      };

      const handleRevert = async () => {
        if (isBusy) return;
        if (!revertArmed) {
          setRevertArmed(true);
          setTimeout(() => setRevertArmed(false), 3000);
          return;
        }
        setRevertArmed(false);
        const res = await safeFetch("/api/revert", { method: "POST" });
        if (res && res.ok) {
          try {
            const body = await res.json();
            setRevertReport({ reverted: body.reverted || [], observed_only: body.observed_only || [], at: Date.now() });
          } catch {}
        }
        refreshWorkspace();
      };

      /* ── Derived data ── */
      const diffRows = useMemo(
        () => (Array.isArray(diffData?.stats) ? diffData.stats : []).map(([file, added, deleted]) => ({ file, added, deleted })),
        [diffData]
      );
      const diffObserved = diffData?.observed_only || [];
      const diffText = diffData?.diff || "";
      const boardCounts = useMemo(() => {
        const c = { total: board.length, resolved: 0, in_progress: 0, open: 0, cancelled: 0, active: 0 };
        for (const r of board) {
          if (r.resolution === "resolved") c.resolved++;
          else if (r.resolution === "in_progress") c.in_progress++;
          else if (r.resolution === "cancelled") c.cancelled++;
          else c.open++;
        }
        c.active = c.total - c.cancelled;
        return c;
      }, [board]);

      const sortedBoard = useMemo(() => {
        const rank = { in_progress: 0, open: 1, resolved: 2, cancelled: 3 };
        return [...board].sort((a, b) => (rank[a.resolution] ?? 1) - (rank[b.resolution] ?? 1) || a.id.localeCompare(b.id));
      }, [board]);

      const transcriptBlocks = useMemo(() => messagesToTranscriptBlocks(messages), [messages]);

      // Sidebar roster: search filter → pinned / active / archived sections
      const filteredSessions = useMemo(() => {
        const q = sessionQuery.trim().toLowerCase();
        if (!q) return savedSessions;
        return savedSessions.filter((s) =>
          formatSessionTitle(s).toLowerCase().includes(q)
          || String(s.session_id || "").toLowerCase().includes(q)
          || String(s.workspace_name || "").toLowerCase().includes(q));
      }, [savedSessions, sessionQuery]);
      const pinnedSessions = useMemo(() => filteredSessions.filter((s) => s.pinned && !s.archived), [filteredSessions]);
      const activeSessions = useMemo(() => filteredSessions.filter((s) => !s.pinned && !s.archived), [filteredSessions]);
      const archivedSessions = useMemo(() => filteredSessions.filter((s) => s.archived), [filteredSessions]);
      const visibleBlocks = useMemo(() => {
        const mode = transcriptQuery && transcriptFilter === "all" ? "search" : transcriptFilter;
        return filterTranscript(transcriptBlocks, mode, transcriptQuery);
      }, [transcriptBlocks, transcriptFilter, transcriptQuery]);
      const visibleSourceIds = useMemo(() => {
        const ids = {};
        for (let i = 0; i < visibleBlocks.length; i++) ids[visibleBlocks[i].sourceId] = true;
        return ids;
      }, [visibleBlocks]);
      const visibleMessages = useMemo(
        () => (transcriptFilter === "all" && !transcriptQuery ? messages : messages.filter((msg) => visibleSourceIds[msg.id])),
        [messages, transcriptFilter, transcriptQuery, visibleSourceIds],
      );

      // One dispatcher for the whole capabilities.shortcuts vocabulary.
      useEffect(() => {
        const onKey = (e) => {
          const hasSelection = !!(window.getSelection && String(window.getSelection()));
          const action = shortcutAction({
            key: e.key,
            ctrlKey: e.ctrlKey,
            metaKey: e.metaKey,
            altKey: e.altKey,
            hasSelection,
          });
          if (!action) return;
          if (action === "copy") return; // browser default copies the selection
          e.preventDefault();
          if (action === "command_palette") { setPaletteOpen(true); return; }
          if (action === "help") { setHelpOpen(true); return; }
          if (action === "settings") { setIsSettingsOpen(true); return; }
          if (action === "toggle_sidebar") { setShowLeftSidebar((v) => !v); return; }
          if (action === "toggle_files") { setShowRightSidebar((v) => !v); return; }
          if (action === "interrupt") { handleInterrupt(); return; }
          if (action === "review_next" || action === "review_previous") {
            const list = visibleBlocks;
            let idx = action === "review_next" ? -1 : list.length;
            for (let i = 0; i < list.length; i++) if (list[i].id === reviewId) idx = i;
            const next = action === "review_next"
              ? (list[idx + 1] || list[0])
              : (list[idx - 1] || list[list.length - 1]);
            if (next) setReviewId(next.id);
            return;
          }
          if (action === "review_toggle") {
            if (!reviewId) return;
            const src = String(reviewId).split(":")[0];
            const esc = (window.CSS && CSS.escape) ? CSS.escape : (s) => s;
            const el = document.querySelector(`[data-block-id="${esc(reviewId)}"] button`)
              || document.querySelector(`[data-block-id="${esc(src)}"] button`);
            if (el) el.click();
            return;
          }
          if (action === "jump_report") {
            const jumped = withJumpToReport({ filter: transcriptFilter, blocks: transcriptBlocks });
            setTranscriptFilter(jumped.filter);
            setReviewId(jumped.reviewId);
            return;
          }
          if (action === "copy_report") {
            const text = copyReportText(transcriptBlocks);
            if (text && navigator.clipboard) navigator.clipboard.writeText(text);
          }
        };
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      }, [visibleBlocks, transcriptBlocks, transcriptFilter, reviewId]);

      useEffect(() => {
        if (!reviewId) return;
        const escaped = (window.CSS && CSS.escape) ? CSS.escape(reviewId) : reviewId;
        const source = String(reviewId).split(":")[0];
        const sourceEscaped = (window.CSS && CSS.escape) ? CSS.escape(source) : source;
        const el = document.querySelector(`[data-block-id="${escaped}"]`) || document.querySelector(`[data-block-id="${sourceEscaped}"]`);

                          className="cursor-pointer rounded-lg px-2.5 py-1 text-[11.5px] font-medium"
                          style={{ backgroundColor: "var(--surface)", boxShadow: "var(--shadow-btn)", color: "var(--ink-2)", border: "none" }}
                        >
                          {isZh ? "重新连接" : "Retry"}
                        </button>
                      </div>

                    {visibleMessages.length === 0 && messages.length === 0 && !isBusy && (
                      <div className="mx-auto my-14 flex max-w-md flex-col items-center text-center">

                             style={{ backgroundColor: "var(--surface)", borderColor: "var(--line)", color: "var(--ink)" }}>

                        </div>

                          {modeIsReact
