                  <span style={{ color: "var(--ink-3)" }}><Icons.folder /></span>
                  <span className="min-w-0 flex-1">
                    <span className="block truncate text-[11.5px] font-medium" style={{ color: "var(--ink)" }}>{activeWorkspaceName}</span>
                    <span className="mono block truncate text-[9.5px]" style={{ color: "var(--ink-3)" }}>{activeCwd}</span>
                  </span>
                  <span className="shrink-0" style={{ color: "var(--ink-3)" }}>
                    <Icons.settings />
                  </span>
                </button>
              </div>
            </aside>
          )}

          {/* ─────────── 2. CENTER: stream + composer ─────────── */}
          <div className="flex flex-1 flex-col overflow-hidden">
            {/* Topbar */}
            <header className="flex h-12 shrink-0 items-center justify-between border-b px-4"
                    style={{ backgroundColor: "var(--surface)", borderColor: "var(--line)" }}>
              <div className="flex min-w-0 items-center gap-2.5">
                {!showLeftSidebar && (
                  <div className="flex items-center gap-2">
                    <button
                      type="button"
                      onClick={() => setShowLeftSidebar(true)}
                      className="cursor-pointer rounded-lg p-1.5 transition-colors duration-100"
                      style={{ color: "var(--ink-2)", background: "none", border: "none" }}
                      onMouseEnter={(e) => e.currentTarget.style.backgroundColor = "var(--hover)"}
                      onMouseLeave={(e) => e.currentTarget.style.backgroundColor = "transparent"}
                      title={isZh ? "展开侧边栏" : "Expand sidebar"}
                    >
                      <Icons.sidebar />
                    </button>
                    <div className="flex items-center gap-1.5 pr-2 border-r" style={{ borderColor: "var(--line)" }}>
                      <Icons.apodexMark className="size-4" />
                      <span className="font-semibold text-[13px]" style={{ color: "var(--ink)" }}>Apodex</span>
                    </div>
                  </div>
                )}

                {/* Session chip — mode is bound at creation */}
                <div
                  className="flex select-none items-center gap-1.5 rounded-full px-3 py-1 text-[12px] font-medium"
                  style={{ backgroundColor: modeTint, color: modeInk }}
                  title={isZh ? "会话模式在创建时绑定；切换模式请新建会话" : "Mode is fixed per session — create a new session to switch"}
                >
                  {modeIsReact ? <Icons.bolt /> : <Icons.users />}
                  <span>{modeIsReact ? "ReAct" : "Agent Team"}</span>
                  <span className="opacity-50"><Icons.lock /></span>
                </div>

                <span className="mono hidden truncate text-[10.5px] md:inline" style={{ color: "var(--ink-3)" }}>
                  {status?.session_id ? `#${status.session_id.slice(-8)}` : ""}
                </span>

                {!connected && (
                  <span className="flex items-center gap-1.5 rounded-full px-2.5 py-0.5 text-[11px]"
                        style={{ backgroundColor: "var(--red-tint)", color: "var(--red)" }}>
                    <span className="size-1.5 rounded-full" style={{ backgroundColor: "var(--red)" }} />
                    {isZh ? "离线" : "Offline"}
                  </span>
                )}
              </div>

              <div className="flex shrink-0 items-center gap-2">
                {/* Status chip — time is visible */}
                {isBusy ? (
                  <div className="flex items-center gap-1.5 rounded-full px-2.5 py-1 text-[11.5px] font-medium"
                       style={{ backgroundColor: "var(--accent-tint)", color: "var(--accent-ink)" }}>
                    <Spinner size={10} />
                    <span>{isZh ? "执行中" : "Running"}</span>
                    {runningElapsed != null && <span className="mono tabular-nums">· {fmtElapsed(runningElapsed)}</span>}
                    <button
                      type="button"
                      onClick={handleInterrupt}
                      className="ml-1 cursor-pointer rounded-full px-1.5 py-px text-[10.5px] font-medium"
                      style={{ backgroundColor: "var(--red-tint)", color: "var(--red)", border: "none" }}
                      title={isZh ? "中断当前任务" : "Interrupt task"}
                    >
                      {isZh ? "停止" : "Stop"}
                    </button>
                  </div>
                ) : (
                  <div className="flex items-center gap-1.5 rounded-full px-2.5 py-1 text-[11.5px]"
                       style={{ backgroundColor: "var(--green-tint)", color: "var(--green)" }}>
                    <span className="size-1.5 rounded-full" style={{ backgroundColor: "var(--green)" }} />
                    <span>{isZh ? "就绪" : "Ready"}</span>
                  </div>
                )}

                <div
                  className="hidden items-center gap-1.5 rounded-md px-2 py-1 text-[11px] md:flex"
                  style={{ backgroundColor: "var(--inset)", boxShadow: "var(--shadow-hairline)", color: "var(--ink-2)" }}
                  title={`prompt ${Number(usage.prompt_tokens || 0).toLocaleString()} · completion ${Number(usage.completion_tokens || 0).toLocaleString()}`}
                >
                  <span>tokens</span>
                  <span className="mono font-medium tabular-nums" style={{ color: "var(--ink)" }}>{totalTokens.toLocaleString()}</span>
                </div>

                <button
                  type="button"
                  onClick={toggleLang}
                  className="cursor-pointer rounded-lg px-2 py-1 text-[11px] font-semibold transition-colors duration-100"
                  style={{ backgroundColor: "var(--surface)", boxShadow: "var(--shadow-btn)", color: "var(--ink-2)", border: "none" }}
                >
                  {isZh ? "EN" : "中文"}
                </button>

                <button
                  type="button"
                  onClick={toggleTheme}
                  className="cursor-pointer rounded-lg p-1.5 transition-colors duration-100"
                  style={{ backgroundColor: "var(--surface)", boxShadow: "var(--shadow-btn)", color: "var(--ink-2)", border: "none" }}
                  title={isZh ? (isDark ? "切换为明亮模式" : "切换为暗黑模式") : (isDark ? "Switch to light" : "Switch to dark")}
                >
                  {isDark ? <Icons.sun /> : <Icons.moon />}
                </button>

                <button
                  type="button"
                  onClick={() => setShowRightSidebar(!showRightSidebar)}
                  className="cursor-pointer rounded-lg p-1.5 transition-colors duration-100"
                  style={{
                    backgroundColor: showRightSidebar ? "var(--accent-tint)" : "var(--surface)",
                    boxShadow: showRightSidebar ? "none" : "var(--shadow-btn)",
                    color: showRightSidebar ? "var(--accent-ink)" : "var(--ink-2)",
                    border: "none",
                  }}
                  title={isZh ? "切换右侧面板" : "Toggle right panel"}
                >
                  <Icons.panelRight />
                </button>
              </div>
            </header>

            {/* Stream area */}
            <div className="flex flex-1 overflow-hidden">
              <main className="flex flex-1 flex-col overflow-hidden">
                <div ref={chatContainerRef} className="flex-1 overflow-y-auto px-6 py-6">
                  <div className="mx-auto flex max-w-[760px] flex-col gap-4">
                    {!connected && (
                      <div className="flex items-center justify-between rounded-[10px] p-3 text-[12.5px]"
                           style={{ backgroundColor: "var(--orange-tint)", color: "var(--orange)" }}>
                        <div className="flex items-center gap-2">
                          <Icons.alert />
                          <span>{isZh ? "后端服务离线中。请在终端执行 ./boot.sh 启动。" : "Backend offline. Run ./boot.sh to start."}</span>
                        </div>
                        <button
                          type="button"
                          onClick={() => { refreshStatus(); refreshWorkspace(); }}
                          className="cursor-pointer rounded-lg px-2.5 py-1 text-[11.5px] font-medium"
                          style={{ backgroundColor: "var(--surface)", boxShadow: "var(--shadow-btn)", color: "var(--ink-2)", border: "none" }}
                        >
                          {isZh ? "重新连接" : "Retry"}
                        </button>
                      </div>
                    )}

                    {/* Empty state */}
                    {messages.length === 0 && !isBusy && (
                      <div className="mx-auto my-14 flex max-w-md flex-col items-center text-center">
                        <div className="mb-4 flex size-14 items-center justify-center rounded-2xl border shadow-sm"
                             style={{ backgroundColor: "var(--surface)", borderColor: "var(--line)", color: "var(--ink)" }}>
                          <Icons.apodexMark className="size-9" />
                        </div>
                        <h3 className="mb-1 text-[16px] font-semibold" style={{ color: "var(--ink)" }}>
                          {modeIsReact
                            ? (isZh ? "Apodex ReAct 单智能体会话" : "Apodex ReAct session")
                            : (isZh ? "Apodex Agent Team 协作会话" : "Apodex Agent Team session")}
                        </h3>
                        <p className="mb-5 text-[12.5px] leading-relaxed" style={{ color: "var(--ink-2)" }}>
                          {modeIsReact
                            ? (isZh ? "单个有状态 Agent 自主调研、读写文件、执行命令并迭代，所有变更需你审批且可撤销。" : "One stateful agent researches, edits files and runs commands — every change needs your approval and is revertible.")
                            : (isZh ? "协调器维护任务看板，把独立子任务分派给并行子 Agent，汇总报告并给出结论。" : "A coordinator keeps a task board, delegates independent work to parallel sub-agents, then synthesizes their reports.")}
                        </p>
                        <div className="flex flex-wrap justify-center gap-2">
                          {(modeIsReact
                            ? [
                                isZh ? "分析当前代码库结构并生成总结" : "Analyze repo structure and summarize",
                                isZh ? "实现高并发 LRU 缓存与单元测试" : "Implement an LRU cache with tests",
                                isZh ? "重构数据校验逻辑" : "Refactor the validation logic",
                              ]
                            : [
                                isZh ? "调研并对比主流 Agent 架构设计方案" : "Research & compare agent architectures",
                                isZh ? "全方位代码审计并出具整改报告" : "Audit the codebase and report findings",
                                isZh ? "构建全套端到端微服务测试流水线" : "Build an end-to-end testing pipeline",
                              ]
                          ).map((preset, i) => (
                            <button
                              key={i}
                              onClick={() => setInputPrompt(preset)}
                              className="cursor-pointer rounded-full px-3 py-1.5 text-[12px] transition-colors duration-100"
                              style={{ backgroundColor: "var(--surface)", boxShadow: "var(--shadow-btn)", color: "var(--ink-2)", border: "none" }}
                              onMouseEnter={(e) => e.currentTarget.style.backgroundColor = "var(--hover)"}
                              onMouseLeave={(e) => e.currentTarget.style.backgroundColor = "var(--surface)"}
                            >
                              {preset}
                            </button>
                          ))}
                        </div>
                      </div>
                    )}

                    {/* Settled messages (chronological: turns, notes) */}
                    {messages.map((msg) => (
                      <div key={msg.id} className="anim-fade-up">
                        {msg.role === "user" ? (
                          <div className="flex justify-end">
                            <div className="max-w-[75%] whitespace-pre-wrap rounded-[10px] px-3.5 py-2.5 text-[13px] leading-relaxed"
                                 style={{ backgroundColor: "var(--accent-tint)", color: "var(--ink)" }}>
                              {msg.content}
                            </div>
                          </div>
                        ) : msg.role === "note" ? (
                          <SystemNoteRow note={{ text: msg.content, tone: msg.tone }} />
                        ) : (
                          <div className="flex flex-col gap-2.5">
                            {msg.thinking && (
                              <ThinkingTrace live={false} text={msg.thinking} elapsedMs={msg.thinkingMs} isZh={isZh} defaultOpen={false} />
                            )}
                            {msg.toolCalls && msg.toolCalls.length > 0 && (
                              <div className="flex flex-col">
                                {msg.toolCalls.map((tc, i) => (
                                  <ToolChipRow key={tc.call_id || i} tool={tc} isZh={isZh} onOpenPreview={handleOpenPreview} />
                                ))}
                              </div>
                            )}
                            {msg.content && (
                              <div className="md-preview md-inline select-text" style={{ color: "var(--ink)" }}
                                   dangerouslySetInnerHTML={{ __html: window.marked ? window.marked.parse(msg.content) : msg.content }} />
                            )}
                          </div>
                        )}
                      </div>
                    ))}

                    {/* Live stream */}
                    {isBusy && (
                      <div className="flex flex-col gap-2.5">
                        {activeThinking && (
                          <ThinkingTrace
                            live
                            text={activeThinking}
                            elapsedMs={thinkingStartedAt != null ? nowTick - thinkingStartedAt : null}
                            isZh={isZh}
                            defaultOpen
                          />
                        )}
                        {activeToolCalls.length > 0 && (
                          <div className="flex flex-col">
                            {activeToolCalls.map((tc, i) => (
                              <ToolChipRow key={tc.call_id || i} tool={tc} isZh={isZh} onOpenPreview={handleOpenPreview} />
                            ))}
                          </div>
                        )}
                        {activeContent && (
                          <div className="select-text whitespace-pre-wrap text-[13.5px] leading-relaxed" style={{ color: "var(--ink)" }}>
                            {activeContent}<span className="caret" />
                          </div>
                        )}
                        {!activeThinking && !activeContent && activeToolCalls.length === 0 && (
                          <div className="flex items-center gap-2 px-1 text-[12px]" style={{ color: "var(--ink-2)" }}>
                            <Spinner size={11} />
                            <span>{isZh ? "正在思考…" : "Thinking…"}</span>
                            {runningElapsed != null && <span className="mono text-[10.5px] tabular-nums" style={{ color: "var(--ink-3)" }}>{fmtElapsed(runningElapsed)}</span>}
                          </div>
                        )}
                      </div>
                    )}

                    {/* Approval — one question at a time */}
                    {pendingApproval && (
                      <ApprovalCard
                        approval={pendingApproval}
                        feedback={feedbackText}
                        setFeedback={setFeedbackText}
                        onResolve={handleApproval}
                        isZh={isZh}
                      />
                    )}
                  </div>
                </div>

                {/* Composer — one control surface; steer mode while running */}
                <footer className="shrink-0 px-6 pb-4 pt-2">
                  <div className="mx-auto max-w-[760px]">
                    {steerFlash && (
                      <div className="anim-fade-up mb-1.5 flex items-center gap-1.5 px-1 text-[11px]" style={{ color: "var(--accent-ink)" }}>
                        <Icons.steer />
                        <span className="truncate">
                          {isZh ? "已加入注入队列，将在下一个安全轮次生效：" : "Queued — applies at the next safe turn boundary: "}
                          <span className="mono">{steerFlash}</span>
                        </span>
                      </div>
                    )}
                    <div
                      className="flex flex-col gap-1.5 rounded-[10px] p-3 transition-shadow duration-200"
                      style={{
                        backgroundColor: "var(--surface)",
                        boxShadow: isBusy ? "0 0 0 1px var(--accent), 0 2px 10px #0000000b" : "var(--shadow-raised)",
                      }}
                    >
                      <textarea
                        rows="2"
                        value={inputPrompt}
                        onChange={(e) => setInputPrompt(e.target.value)}
                        onKeyDown={(e) => {
                          if (e.key === "Enter" && !e.shiftKey) {
                            e.preventDefault();
                            if (isBusy) handleSteer(); else handleSend();
                          }
                        }}
                        placeholder={
                          isBusy
                            ? (isZh ? "实时干预：输入指令，将在下一个安全轮次注入，不打断当前执行…" : "Steer: your instruction is injected at the next safe turn boundary…")
                            : modeIsReact
                              ? (isZh ? "描述任务，ReAct Agent 将自主规划与执行…" : "Describe a task — the ReAct agent plans and executes…")
                              : (isZh ? "描述复杂课题，协调器将拆解到任务看板并分派子 Agent…" : "Describe a complex goal — the coordinator builds a task board and delegates…")
                        }
                        className="w-full resize-none bg-transparent text-[13.5px] outline-none"
                        style={{ color: "var(--ink)", border: "none" }}
                      />
                      <div className="flex items-center gap-2">
                        <span
                          className="flex select-none items-center gap-1 rounded-md px-1.5 py-0.5 text-[10.5px] font-medium"
                          style={{ backgroundColor: modeTint, color: modeInk }}
                        >
                          {modeIsReact ? <Icons.bolt /> : <Icons.users />}
                          {modeIsReact ? "ReAct" : "Team"}
                        </span>
                        <span className="hidden text-[10.5px] sm:inline" style={{ color: "var(--ink-3)" }}>
                          {isBusy
                            ? (isZh ? "Enter 注入 · 不会丢弃当前运行" : "Enter to queue — the active run is kept")
                            : (isZh ? "Enter 发送 · Shift+Enter 换行" : "Enter to send · Shift+Enter for newline")}
                        </span>
                        <div className="ml-auto flex items-center gap-1.5">
                          {isBusy && (
                            <button
                              type="button"
                              onClick={handleInterrupt}
                              className="flex cursor-pointer items-center gap-1 rounded-lg px-2.5 py-1.5 text-[11.5px] font-medium transition-colors duration-100"
                              style={{ backgroundColor: "var(--red-tint)", color: "var(--red)", border: "none" }}
                              title={isZh ? "中断当前任务" : "Interrupt the running task"}
                            >
                              <Icons.close />
                              <span>{isZh ? "停止" : "Stop"}</span>
                            </button>
                          )}
                          <button
                            type="button"
                            disabled={!inputPrompt.trim()}
                            onClick={isBusy ? handleSteer : handleSend}
                            className="flex size-7 cursor-pointer items-center justify-center rounded-full transition-all duration-150 disabled:cursor-default"
                            style={{
                              backgroundColor: inputPrompt.trim() ? "var(--accent)" : "var(--field)",
                              color: inputPrompt.trim() ? "#fff" : "var(--ink-3)",
                              boxShadow: inputPrompt.trim() ? "none" : "var(--shadow-inset-field)",
                              border: "none",
                            }}
                            title={isBusy ? (isZh ? "注入指令" : "Steer") : (isZh ? "发送" : "Send")}
                          >
                            {isBusy ? <Icons.steer /> : <Icons.send />}
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                </footer>
              </main>

              {/* ─────────── 3. RIGHT PANEL: board / outputs / team / status ─────────── */}
              {showRightSidebar && (
                <aside className="hidden w-80 select-none flex-col overflow-hidden border-l lg:flex"
                       style={{ backgroundColor: "var(--surface)", borderColor: "var(--line)" }}>
                  <div className="flex gap-0.5 p-1" style={{ backgroundColor: "var(--field)" }}>
                    {[
                      { key: "board", label: isZh ? "看板" : "Board", icon: Icons.board, badge: boardCounts.total > 0 ? `${boardCounts.resolved}/${boardCounts.active}` : null },
                      { key: "outputs", label: isZh ? "产物" : "Outputs", icon: Icons.boxes, badge: artifacts.length > 0 ? String(artifacts.length) : null },
                      { key: "team", label: isZh ? "团队" : "Team", icon: Icons.users, badge: subagents.length > 0 ? String(subagents.length) : null },
                      { key: "status", label: isZh ? "状态" : "Status", icon: Icons.terminal, badge: null },
                    ].map((t) => (
                      <button
                        key={t.key}
                        type="button"
                        onClick={() => setRightTab(t.key)}
                        className="flex flex-1 cursor-pointer items-center justify-center gap-1 rounded-md py-1.5 text-[11px] transition-colors duration-100"
                        style={{
                          backgroundColor: rightTab === t.key ? "var(--surface)" : "transparent",
                          boxShadow: rightTab === t.key ? "var(--shadow-hairline)" : "none",
                          color: rightTab === t.key ? "var(--ink)" : "var(--ink-2)",
                          fontWeight: rightTab === t.key ? 500 : 400,
                          border: "none",
                        }}
                      >
                        <t.icon />
                        <span>{t.label}</span>
                        {t.badge && <span className="mono text-[9.5px] tabular-nums" style={{ color: "var(--ink-3)" }}>{t.badge}</span>}
                      </button>
                    ))}
                  </div>

                  <div className="flex-1 space-y-4 overflow-y-auto p-4">
                    {/* ── Task board — the Agent Team centerpiece (ReAct plans land here too) ── */}
                    {rightTab === "board" && (
                      <div className="space-y-3">
                        <div className="flex items-center justify-between">
                          <h4 className="text-[11.5px] font-semibold uppercase tracking-wider" style={{ color: "var(--ink-3)" }}>
                            {isZh ? "任务看板" : "Task board"}
                          </h4>
                          {boardCounts.total > 0 && (
                            <span className="mono text-[10.5px] tabular-nums" style={{ color: "var(--ink-3)" }}>
                              {boardCounts.resolved}/{boardCounts.active} {isZh ? "完成" : "done"} · {boardCounts.in_progress} {isZh ? "进行中" : "active"} · {boardCounts.open} {isZh ? "未开始" : "open"}
                              {boardCounts.cancelled > 0 ? ` · ${boardCounts.cancelled} ${isZh ? "已取消" : "cancelled"}` : ""}
                            </span>
                          )}
                        </div>

                        {board.length === 0 ? (
                          <div className="rounded-[10px] p-4 text-center text-[12px] leading-relaxed"
                               style={{ backgroundColor: "var(--inset)", boxShadow: "var(--shadow-hairline)", color: "var(--ink-3)" }}>
                            {isZh
                              ? "Agent 通过 add_task / update_task 拆解与推进任务后，看板将在此实时呈现"
                              : "Once the agent decomposes work via add_task / update_task, the board appears here live"}
                          </div>
                        ) : (
                          <div className="overflow-hidden rounded-[10px]" style={{ backgroundColor: "var(--surface)", boxShadow: "var(--shadow-card)" }}>
                            {sortedBoard.map((task, idx) => {
                              const full = descMapRef.current[task.description] || task.description;
                              const state = task.resolution;
                              return (
                                <div
                                  key={task.id}
                                  className="anim-fade-up flex items-start gap-2.5 px-3 py-2.5 text-[12.5px]"
                                  style={{
                                    borderBottom: idx < sortedBoard.length - 1 ? "1px solid var(--line)" : "none",
                                    color: state === "resolved" || state === "cancelled" ? "var(--ink-3)" : "var(--ink)",
                                  }}
                                  title={full !== task.description ? full : undefined}
                                >
                                  <span className="mt-0.5 flex size-4 shrink-0 items-center justify-center">
                                    {state === "in_progress" ? <Spinner size={11} />
                                      : state === "resolved" ? <span style={{ color: "var(--green)" }}><Icons.check /></span>
                                      : state === "cancelled" ? <span style={{ color: "var(--ink-3)" }}><Icons.x /></span>
                                      : <span className="size-2 rounded-full" style={{ border: "1.5px solid var(--line-strong)" }} />}
                                  </span>
                                  <div className="min-w-0 flex-1">
                                    <div style={state === "cancelled" ? { textDecoration: "line-through", textDecorationColor: "var(--ink-3)" } : undefined}>
                                      {full}
                                    </div>
                                    <div className="mt-0.5 flex flex-wrap items-center gap-1">
                                      <span className="mono text-[10px]" style={{ color: "var(--ink-3)" }}>{task.id}</span>
                                      {task.owners.map((o) => (
                                        <span key={o} className="mono rounded px-1 py-px text-[9.5px]"
                                              style={{ backgroundColor: "var(--field)", boxShadow: "var(--shadow-hairline)", color: "var(--ink-2)" }}>
                                          {o}
                                        </span>
                                      ))}
                                    </div>
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        )}

                        {subagents.length > 0 && (
                          <div className="rounded-[10px] p-3 text-[11.5px]"
                               style={{ backgroundColor: "var(--inset)", boxShadow: "var(--shadow-hairline)", color: "var(--ink-2)" }}>
                            <span style={{ color: "var(--ink-3)" }}>{isZh ? "并行子 Agent：" : "Parallel sub-agents: "}</span>
                            {subagents.filter(a => a.status === "running").length} {isZh ? "运行中" : "running"} · {subagents.length} {isZh ? "总计" : "total"}
                          </div>
                        )}
                      </div>
                    )}

                    {/* ── Outputs: sandbox semantics made visible ── */}
                    {rightTab === "outputs" && (
                      <div className="space-y-4">
                        <div className="flex items-center justify-between">
                          <h4 className="text-[11.5px] font-semibold uppercase tracking-wider" style={{ color: "var(--ink-3)" }}>
                            {isZh ? "沙箱产物" : "Sandbox files"}
                          </h4>
                          <button
                            type="button"
                            onClick={refreshWorkspace}
                            className="flex cursor-pointer items-center gap-1 text-[11px] transition-colors duration-100 hover:underline"
                            style={{ color: "var(--accent-ink)", background: "none", border: "none" }}
                          >
                            <Icons.refresh /><span>{isZh ? "刷新" : "Refresh"}</span>
                          </button>
                        </div>

                        {/* Transparent deliverables: the host run dir */}
                        {status?.session_id && (
                          <div className="rounded-lg px-2.5 py-2" style={{ backgroundColor: "var(--inset)", boxShadow: "var(--shadow-hairline)" }}>
                            <div className="text-[10px] font-semibold uppercase tracking-wider" style={{ color: "var(--ink-3)" }}>
                              {isZh ? "宿主机运行目录" : "Host run directory"}
                            </div>
                            <div className="mono mt-0.5 break-all text-[10.5px] leading-snug" style={{ color: "var(--ink-2)" }}>
                              .apodex/runs/{status.session_id}/
                            </div>
                          </div>
                        )}

                        {[
                          { category: "outputs", title: isZh ? "交付产物 · /outputs" : "Deliverables · /outputs", hint: isZh ? "持久化交付物" : "persistent deliverables" },
                          { category: "workspace", title: isZh ? "工作区 · /workspace" : "Working state · /workspace", hint: isZh ? "过程文件" : "intermediate state" },
                        ].map((group) => {
                          const files = artifacts.filter((a) => a.category === group.category);
                          return (
                            <div key={group.category} className="space-y-1.5">
                              <div className="flex items-baseline gap-1.5 px-0.5">
                                <span className="text-[11px] font-semibold" style={{ color: "var(--ink-2)" }}>{group.title}</span>
                                <span className="text-[10px]" style={{ color: "var(--ink-3)" }}>{group.hint}</span>
                              </div>
                              {files.length === 0 ? (
                                <div className="rounded-lg px-3 py-2.5 text-[11.5px]"
                                     style={{ backgroundColor: "var(--inset)", boxShadow: "var(--shadow-hairline)", color: "var(--ink-3)" }}>
                                  {group.category === "outputs"
                                    ? (isZh ? "任务产出的交付物将保存在此" : "Deliverables land here")
                                    : (isZh ? "暂无工作区文件" : "No working files yet")}
                                </div>
                              ) : (
                                files.map((art, idx) => (
                                  <div
                                    key={idx}
                                    className="flex items-center justify-between rounded-lg px-2.5 py-2 text-[12px] transition-colors duration-100"
                                    style={{ backgroundColor: "var(--inset)", boxShadow: "var(--shadow-hairline)", cursor: art.is_md ? "pointer" : "default" }}
                                    onClick={() => { if (art.is_md) handleOpenPreview(art.path); }}
                                    onMouseEnter={(e) => { if (art.is_md) e.currentTarget.style.backgroundColor = "var(--hover)"; }}
                                    onMouseLeave={(e) => { if (art.is_md) e.currentTarget.style.backgroundColor = "var(--inset)"; }}
                                  >
                                    <div className="flex min-w-0 items-center gap-2">
                                      {art.is_md ? (
                                        <span className="mono flex size-5 shrink-0 items-center justify-center rounded text-[9px] font-semibold"
                                              style={{ backgroundColor: "var(--accent-tint)", color: "var(--accent-ink)" }}>
                                          MD
                                        </span>
                                      ) : (
                                        <span style={{ color: "var(--ink-3)" }}><Icons.file /></span>
                                      )}
                                      <span className="mono min-w-0 truncate text-[11.5px]" style={{ color: "var(--ink)" }} title={art.name}>
                                        {art.name}
                                      </span>
                                    </div>
                                    <div className="flex shrink-0 items-center gap-2">
                                      <span className="mono text-[10px] tabular-nums" style={{ color: "var(--ink-3)" }}>{fmtKB(art.size)}</span>
                                      {art.is_md && (
                                        <button
                                          type="button"
                                          onClick={(e) => { e.stopPropagation(); handleOpenPreview(art.path); }}
                                          className="cursor-pointer rounded-md px-2 py-0.5 text-[10.5px] font-medium transition-colors duration-100"
                                          style={{ backgroundColor: "var(--surface)", boxShadow: "var(--shadow-btn)", color: "var(--accent-ink)", border: "none" }}
                                        >
                                          {isZh ? "预览" : "View"}
                                        </button>
                                      )}
                                    </div>
                                  </div>
                                ))
                              )}
                            </div>
                          );
                        })}
                      </div>
                    )}

                    {/* ── Team: real subagent snapshots only ── */}
                    {rightTab === "team" && (
                      <div className="space-y-3">
                        <h4 className="text-[11.5px] font-semibold uppercase tracking-wider" style={{ color: "var(--ink-3)" }}>
                          {isZh ? "子 Agent 协作树" : "Sub-agent tree"}
                        </h4>
                        {subagents.length === 0 ? (
                          <div className="rounded-[10px] p-4 text-center text-[12px] leading-relaxed"
                               style={{ backgroundColor: "var(--inset)", boxShadow: "var(--shadow-hairline)", color: "var(--ink-3)" }}>
                            {isZh
                              ? "Agent Team 模式下，协调器创建的子 Agent 将在此实时显示"
                              : "In Agent Team mode, sub-agents spawned by the coordinator appear here live"}
                          </div>
                        ) : (
                          <div className="space-y-2">
                            {subagents.map((ag) => {
                              const st = ag.status || "running";
                              const pill = st === "running"
                                ? { bg: "var(--accent-tint)", fg: "var(--accent-ink)", label: isZh ? "运行中" : "running" }
                                : st === "completed" || st === "reported" || st === "done"
                                  ? { bg: "var(--green-tint)", fg: "var(--green)", label: isZh ? "已完成" : "done" }
                                  : st === "error" || st === "failed"
                                    ? { bg: "var(--red-tint)", fg: "var(--red)", label: isZh ? "失败" : "failed" }
                                    : { bg: "var(--inset)", fg: "var(--ink-3)", label: st };
                              return (
                                <div key={ag.id} className="anim-fade-up rounded-[10px] p-3 text-[12px]"
                                     style={{ backgroundColor: "var(--surface)", boxShadow: "var(--shadow-card)" }}>
                                  <div className="mb-1 flex items-center justify-between gap-2">
                                    <div className="flex min-w-0 items-center gap-2">
                                      {st === "running" ? <Spinner size={10} /> : <span className="size-1.5 rounded-full" style={{ backgroundColor: pill.fg }} />}
                                      <span className="truncate font-semibold" style={{ color: "var(--ink)" }}>{ag.name}</span>
                                    </div>
                                    <span className="shrink-0 rounded-full px-2 py-px text-[10px] font-medium"
                                          style={{ backgroundColor: pill.bg, color: pill.fg }}>
                                      {pill.label}
                                    </span>
                                  </div>
                                  <div className="mono mb-0.5 text-[10px]" style={{ color: "var(--ink-3)" }}>{ag.role}</div>
                                  {ag.action && <p className="text-[11.5px]" style={{ color: "var(--ink-2)" }}>{ag.action}</p>}
                                  {(ag.tokens != null || ag.duration != null) && (
                                    <div className="mono mt-1 text-[10px] tabular-nums" style={{ color: "var(--ink-3)" }}>
                                      {ag.tokens != null && <span>{Number(ag.tokens).toLocaleString()} tok</span>}
                                      {ag.tokens != null && ag.duration != null && <span> · </span>}
                                      {ag.duration != null && <span>{typeof ag.duration === "number" ? fmtElapsed(ag.duration > 1000 ? ag.duration : ag.duration * 1000) : ag.duration}</span>}
                                    </div>
                                  )}
                                  {ag.logs && ag.logs.length > 0 && (
                                    <div className="mono mt-2 max-h-24 overflow-y-auto rounded-md p-2 text-[10.5px]"
                                         style={{ backgroundColor: "var(--inset)", boxShadow: "var(--shadow-hairline)", color: "var(--ink-3)" }}>
                                      {ag.logs.map((l, idx) => <div key={idx}>› {l}</div>)}
                                    </div>
                                  )}
                                </div>
                              );
                            })}
                          </div>
                        )}
                      </div>
                    )}

                    {/* ── Status: runtime, tokenomics, changes ── */}
                    {rightTab === "status" && (
                      <div className="space-y-3 text-[12px]">
                        <div className="rounded-[10px] p-3.5" style={{ backgroundColor: "var(--surface)", boxShadow: "var(--shadow-card)" }}>
                          <h4 className="mb-2 text-[11.5px] font-semibold uppercase tracking-wider" style={{ color: "var(--ink-3)" }}>
                            {isZh ? "运行时" : "Runtime"}
                          </h4>
                          <div className="space-y-1.5">
                            <div className="flex items-center justify-between gap-2">
                              <span style={{ color: "var(--ink-2)" }}>{isZh ? "会话" : "Session"}</span>
                              <span className="mono truncate text-[10.5px]" style={{ color: "var(--ink)" }}>{status?.session_id || "—"}</span>
                            </div>
                            <div className="flex items-center justify-between gap-2">
                              <span style={{ color: "var(--ink-2)" }}>{isZh ? "模式" : "Mode"}</span>
                              <span className="mono text-[10.5px] font-semibold uppercase" style={{ color: modeInk }}>{activeMode}</span>
                            </div>
                            <div className="flex items-center justify-between gap-2">
                              <span style={{ color: "var(--ink-2)" }}>{isZh ? "模型" : "Model"}</span>
                              <span className="mono truncate text-[10.5px]" style={{ color: "var(--ink)" }}>{status?.model || "—"}</span>
                            </div>
                            <div className="flex items-center justify-between gap-2">
                              <span style={{ color: "var(--ink-2)" }}>{isZh ? "轮次" : "Turns"}</span>
                              <span className="mono text-[10.5px] tabular-nums" style={{ color: "var(--ink)" }}>{status?.usage?.turns ?? "—"}</span>
                            </div>
                            <div className="flex items-center justify-between gap-2">
                              <span style={{ color: "var(--ink-2)" }}>{isZh ? "工作区" : "Workspace"}</span>
                              <button
                                type="button"
                                onClick={() => setIsWorkspaceModalOpen(true)}
                                className="mono flex min-w-0 cursor-pointer items-center gap-1 truncate text-[10.5px] transition-colors duration-100 hover:underline"
                                style={{ color: "var(--accent-ink)", background: "none", border: "none" }}
                                title={activeCwd}
                              >
                                <Icons.folder />
                                <span className="truncate">{activeWorkspaceName}</span>
                              </button>
                            </div>
                          </div>
                        </div>

                        <div className="rounded-[10px] p-3.5" style={{ backgroundColor: "var(--surface)", boxShadow: "var(--shadow-card)" }}>
                          <h4 className="mb-2 text-[11.5px] font-semibold uppercase tracking-wider" style={{ color: "var(--ink-3)" }}>
                            Tokenomics
                          </h4>
                          <div className="space-y-1.5">
                            <div className="flex items-center justify-between">
                              <span style={{ color: "var(--ink-2)" }}>Prompt</span>
                              <span className="mono text-[10.5px] tabular-nums" style={{ color: "var(--ink)" }}>{Number(usage.prompt_tokens || 0).toLocaleString()}</span>
                            </div>
                            <div className="flex items-center justify-between">
                              <span style={{ color: "var(--ink-2)" }}>Completion</span>
                              <span className="mono text-[10.5px] tabular-nums" style={{ color: "var(--ink)" }}>{Number(usage.completion_tokens || 0).toLocaleString()}</span>
                            </div>
                            <div className="flex items-center justify-between border-t pt-1.5" style={{ borderColor: "var(--line)" }}>
                              <span className="font-medium" style={{ color: "var(--ink)" }}>Total</span>
                              <span className="mono text-[10.5px] font-semibold tabular-nums" style={{ color: "var(--accent-ink)" }}>{totalTokens.toLocaleString()}</span>
                            </div>
                          </div>
                          {contextWindow > 0 && (
                            <div className="mt-2.5">
                              <div className="mb-1 flex items-center justify-between text-[10.5px]" style={{ color: "var(--ink-3)" }}>
                                <span>{isZh ? "上下文窗口" : "Context window"}</span>
                                <span className="mono tabular-nums">{Math.min(100, Math.round((totalTokens / contextWindow) * 100))}% · {contextWindow.toLocaleString()}</span>
                              </div>
                              <div className="h-1 overflow-hidden rounded-full" style={{ backgroundColor: "var(--field)" }}>
                                <div
                                  className="h-full rounded-full transition-all duration-500"
                                  style={{
                                    width: `${Math.min(100, (totalTokens / contextWindow) * 100)}%`,
                                    backgroundColor: totalTokens / contextWindow > 0.85 ? "var(--orange)" : "var(--accent)",
                                  }}
                                />
                              </div>
                            </div>
                          )}
                        </div>

                        <div className="rounded-[10px] p-3.5" style={{ backgroundColor: "var(--surface)", boxShadow: "var(--shadow-card)" }}>
                          <div className="mb-2 flex items-center justify-between">
                            <h4 className="text-[11.5px] font-semibold uppercase tracking-wider" style={{ color: "var(--ink-3)" }}>
                              {isZh ? "文件变更" : "Changes"}
                            </h4>
                            {Object.keys(diffStats).length > 0 && (
                              <button
                                type="button"
                                onClick={handleRevert}
                                className="cursor-pointer rounded-md px-2 py-0.5 text-[10.5px] font-medium transition-colors duration-100"
                                style={{
                                  backgroundColor: revertArmed ? "var(--red)" : "var(--red-tint)",
                                  color: revertArmed ? "#fff" : "var(--red)",
                                  border: "none",
                                }}
                                title="/revert"
                              >
                                {revertArmed ? (isZh ? "确认撤销？" : "Confirm?") : (isZh ? "全部撤销" : "Revert all")}
                              </button>
                            )}
                          </div>
                          {Object.keys(diffStats).length === 0 ? (
                            <div className="text-[11.5px]" style={{ color: "var(--ink-3)" }}>
                              {isZh ? "当前无可撤销的文件修改" : "No revertible file changes"}
                            </div>
                          ) : (
                            <div className="space-y-1">
                              {Object.entries(diffStats).map(([f, stat]) => (
                                <div key={f} className="flex items-center justify-between gap-2 rounded-md px-2 py-1.5"
                                     style={{ backgroundColor: "var(--inset)", boxShadow: "var(--shadow-hairline)" }}>
                                  <span className="mono min-w-0 truncate text-[11px]" style={{ color: "var(--ink)" }} title={f}>{f}</span>
                                  <div className="mono flex shrink-0 items-center gap-1.5 text-[10.5px] tabular-nums">
                                    {stat.added > 0 && <span style={{ color: "var(--green)" }}>+{stat.added}</span>}
                                    {stat.deleted > 0 && <span style={{ color: "var(--red)" }}>-{stat.deleted}</span>}
                                  </div>
                                </div>
                              ))}
                            </div>
                          )}
                        </div>
                      </div>
                    )}
                  </div>
                </aside>
              )}
            </div>
          </div>

          {/* ── Modals ── */}
          <MarkdownPreviewModal fileData={previewFile} onClose={() => setPreviewFile(null)} isZh={isZh} />

          <WorkspaceManagerModal
            isOpen={isWorkspaceModalOpen}
            onClose={() => setIsWorkspaceModalOpen(false)}
            workspaces={workspaces}
            activeCwd={activeCwd}
            onAdd={handleAddWorkspace}
            onRemove={handleRemoveWorkspace}
            onSelect={handleSelectWorkspace}
            isZh={isZh}
          />

          {inspectSession && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4 backdrop-blur-sm" onClick={() => setInspectSession(null)}>
              <div className="anim-pop-in flex max-h-[85vh] w-full max-w-3xl flex-col overflow-hidden rounded-[10px]"
                   style={{ backgroundColor: "var(--surface)", boxShadow: "var(--shadow-overlay)" }}
                   onClick={(e) => e.stopPropagation()}>
                <div className="flex items-center justify-between border-b px-5 py-3.5" style={{ borderColor: "var(--line)" }}>
                  <div>
                    <div className="flex items-center gap-2">
                      <h3 className="text-[13.5px] font-semibold" style={{ color: "var(--ink)" }}>
                        {isZh ? "会话工作痕迹" : "Session trace"}
                      </h3>
                      <span className="rounded-full px-2 py-0.5 text-[10px] font-medium"
                            style={{
                              backgroundColor: inspectSession.state?.mode === "react" ? "var(--accent-tint)" : "var(--green-tint)",
                              color: inspectSession.state?.mode === "react" ? "var(--accent-ink)" : "var(--green)",
                            }}>
                        {inspectSession.state?.mode === "react" ? "ReAct" : "Agent Team"}
                      </span>
                    </div>
                    <p className="mono mt-0.5 text-[10.5px]" style={{ color: "var(--ink-3)" }}>
                      {inspectSession.session_id}
                    </p>
                  </div>
                  <button
                    type="button"
                    onClick={() => setInspectSession(null)}
                    className="cursor-pointer rounded-lg p-1.5 transition-colors duration-100"
                    style={{ color: "var(--ink-3)", background: "none", border: "none" }}
                    onMouseEnter={(e) => e.currentTarget.style.backgroundColor = "var(--hover)"}
                    onMouseLeave={(e) => e.currentTarget.style.backgroundColor = "transparent"}
                  >
                    <Icons.close />
                  </button>
                </div>

                <div className="flex-1 space-y-4 overflow-y-auto p-5 text-[12.5px]">
                  <div className="grid grid-cols-3 gap-2 text-[12px]">
                    {[
                      { label: isZh ? "对话消息" : "Messages", value: inspectSession.state?.history?.length || 0, color: "var(--ink)" },
                      { label: isZh ? "修改文件" : "Modified", value: Object.keys(inspectSession.state?.journal || {}).length, color: "var(--accent-ink)" },
                      { label: isZh ? "生成产物" : "Outputs", value: inspectSession.outputs?.length || 0, color: "var(--green)" },
                    ].map((s, i) => (
                      <div key={i} className="rounded-[10px] p-3 text-center" style={{ backgroundColor: "var(--inset)", boxShadow: "var(--shadow-hairline)" }}>
                        <div style={{ color: "var(--ink-3)" }}>{s.label}</div>
                        <div className="mono text-[16px] font-semibold tabular-nums" style={{ color: s.color }}>{s.value}</div>
                      </div>
                    ))}
                  </div>

                  {inspectSession.outputs && inspectSession.outputs.length > 0 && (
                    <div className="rounded-[10px] p-3" style={{ backgroundColor: "var(--inset)", boxShadow: "var(--shadow-hairline)" }}>
                      <h4 className="mb-2 text-[10.5px] font-semibold uppercase tracking-wider" style={{ color: "var(--ink-3)" }}>
                        {isZh ? "交付产物 · /outputs" : "Deliverables · /outputs"}
                      </h4>
                      <div className="space-y-1">
                        {inspectSession.outputs.map((out, idx) => (
                          <div key={idx} className="flex items-center justify-between rounded-md px-2.5 py-1.5"
                               style={{ backgroundColor: "var(--canvas)", boxShadow: "var(--shadow-hairline)" }}>
                            <div className="flex min-w-0 items-center gap-2">
                              {out.is_md ? (
                                <span className="mono rounded px-1 py-px text-[9px] font-semibold"
                                      style={{ backgroundColor: "var(--accent-tint)", color: "var(--accent-ink)" }}>MD</span>
                              ) : (
                                <span style={{ color: "var(--ink-3)" }}><Icons.file /></span>
                              )}
                              <span className="mono truncate text-[11.5px]" style={{ color: "var(--ink)" }}>{out.name}</span>
                            </div>
                            <div className="flex shrink-0 items-center gap-2">
                              <span className="mono text-[10px] tabular-nums" style={{ color: "var(--ink-3)" }}>{fmtKB(out.size)}</span>
                              {out.is_md && (
                                <button
                                  type="button"
                                  onClick={() => handleOpenPreview(out.path)}
                                  className="cursor-pointer rounded-md px-2 py-0.5 text-[10.5px] font-medium"
                                  style={{ backgroundColor: "var(--surface)", boxShadow: "var(--shadow-btn)", color: "var(--accent-ink)", border: "none" }}
                                >
                                  {isZh ? "预览" : "View"}
                                </button>
                              )}
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {Object.keys(inspectSession.state?.journal || {}).length > 0 && (
                    <div className="rounded-[10px] p-3" style={{ backgroundColor: "var(--inset)", boxShadow: "var(--shadow-hairline)" }}>
                      <h4 className="mb-2 text-[10.5px] font-semibold uppercase tracking-wider" style={{ color: "var(--ink-3)" }}>
                        {isZh ? "修改过的文件" : "Files modified"}
                      </h4>
                      <div className="space-y-1">
                        {Object.keys(inspectSession.state?.journal || {}).map((f) => {
                          const isMd = f.endsWith(".md") || f.endsWith(".markdown");
                          return (
                            <div key={f} className="flex items-center justify-between rounded-md px-2.5 py-1.5"
                                 style={{ backgroundColor: "var(--canvas)", boxShadow: "var(--shadow-hairline)" }}>
                              <div className="flex min-w-0 items-center gap-2">
                                <span style={{ color: "var(--green)" }}><Icons.check /></span>
                                <span className="mono truncate text-[11.5px]" style={{ color: "var(--ink)" }}>{f}</span>
                              </div>
                              {isMd && (
                                <button
                                  type="button"
                                  onClick={() => handleOpenPreview(f)}
                                  className="cursor-pointer rounded-md px-2 py-0.5 text-[10.5px] font-medium"
                                  style={{ backgroundColor: "var(--surface)", boxShadow: "var(--shadow-btn)", color: "var(--accent-ink)", border: "none" }}
                                >
                                  {isZh ? "预览" : "View"}
                                </button>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}

                  <div>
                    <h4 className="mb-2 text-[10.5px] font-semibold uppercase tracking-wider" style={{ color: "var(--ink-3)" }}>
                      {isZh ? "对话与思考快照" : "Conversation snapshot"}
                    </h4>
                    <div className="space-y-2.5">
                      {(inspectSession.state?.display_history || []).map((item, idx) => (
                        <div key={idx} className="rounded-[10px] p-3 text-[12.5px]"
                             style={{
                               backgroundColor: item.role === "user" ? "var(--accent-tint)" : "var(--surface)",
                               boxShadow: "var(--shadow-hairline)",
                             }}>
                          <div className="mono mb-1 text-[10px] font-semibold uppercase"
                               style={{ color: item.role === "user" ? "var(--accent-ink)" : "var(--ink-3)" }}>
                            {item.role}
                          </div>
                          {item.thinking && (
                            <pre className="mono mb-2 max-h-32 overflow-y-auto whitespace-pre-wrap rounded-md p-2.5 text-[11px]"
                                 style={{ backgroundColor: "var(--inset)", boxShadow: "var(--shadow-hairline)", color: "var(--ink-2)" }}>
                              {item.thinking}
                            </pre>
                          )}
                          <div className="whitespace-pre-wrap leading-relaxed" style={{ color: "var(--ink)" }}>
                            {typeof item.content === "string" ? item.content : JSON.stringify(item.content)}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="flex items-center justify-between border-t px-5 py-3" style={{ borderColor: "var(--line)", backgroundColor: "var(--field)" }}>
                  <span className="text-[11.5px]" style={{ color: "var(--ink-3)" }}>
                    {isZh ? `将以 ${inspectSession.state?.mode} 模式恢复该会话` : `Resumes in ${inspectSession.state?.mode} mode`}
                  </span>
                  <div className="flex gap-2">
                    <button
                      type="button"
                      onClick={() => setInspectSession(null)}
                      className="cursor-pointer rounded-lg px-3.5 py-1.5 text-[12px] font-medium transition-colors duration-100"
                      style={{ backgroundColor: "var(--surface)", boxShadow: "var(--shadow-btn)", color: "var(--ink-2)", border: "none" }}
                    >
                      {isZh ? "关闭" : "Close"}
                    </button>
                    <button
                      type="button"
                      disabled={isBusy}
                      onClick={() => handleResumeSession(inspectSession.session_id)}
                      className="flex cursor-pointer items-center gap-1.5 rounded-lg px-4 py-1.5 text-[12px] font-medium text-white transition-all duration-100 hover:brightness-110 disabled:opacity-50"
                      style={{ backgroundColor: "var(--accent)", border: "none" }}
                    >
                      <Icons.bolt />
                      <span>{isZh ? "恢复此会话" : "Resume"}</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    if (window.marked && window.marked.setOptions) {
      window.marked.setOptions({ breaks: true });
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
