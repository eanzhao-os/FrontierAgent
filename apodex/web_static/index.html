<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FrontierAgent Web UI</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React and ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --page: #fafafb;
      --canvas: #f1f2f3;
      --surface: #ffffff;
      --inset: #f7f8f9;
      --hover: #f4f5f6;
      --hover-2: #e7e9eb;
      --ink: #1f2124;
      --ink-2: #62656b;
      --ink-3: #9a9da3;
      --line: #ecedef;
      --line-strong: #e0e2e5;
      --field: #f2f2f3;
      --accent: #0285ff;
      --accent-tint: #e9f3ff;
      --green: #189a4d;
      --green-tint: #e8f5ed;
      --orange: #ef720c;
      --orange-tint: #fdf1e5;
      --red: #e3474c;
      --red-tint: #fcecec;
    }

    .dark {
      --page: #131416;
      --canvas: #18191c;
      --surface: #1e1f23;
      --inset: #16171a;
      --hover: #26282d;
      --hover-2: #2e3036;
      --ink: #f1f3f5;
      --ink-2: #9da1a8;
      --ink-3: #63676e;
      --line: #292b30;
      --line-strong: #363940;
      --field: #24252a;
      --accent: #3d9aff;
      --accent-tint: rgba(61, 154, 255, 0.12);
      --green: #3dbb72;
      --green-tint: rgba(61, 187, 114, 0.12);
      --orange: #f68f3c;
      --orange-tint: rgba(246, 143, 60, 0.12);
      --red: #ee5c61;
      --red-tint: rgba(238, 92, 97, 0.12);
    }

    body {
      background-color: var(--page);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--line-strong);
      border-radius: 4px;
    }

    @keyframes subtlePulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .animate-pulse-subtle {
      animation: subtlePulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden">
  <div id="root" class="h-full w-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ── Clean SVG Icons (Zero Emojis) ──
    const Icons = {
      bolt: () => (
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
        </svg>
      ),
      users: () => (
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
          <path d="M16 3.13a4 4 0 0 1 0 7.75" />
        </svg>
      ),
      sun: () => (
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="12" r="5" />
          <line x1="12" y1="1" x2="12" y2="3" />
          <line x1="12" y1="21" x2="12" y2="23" />
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
          <line x1="1" y1="12" x2="3" y2="12" />
          <line x1="21" y1="12" x2="23" y2="12" />
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
        </svg>
      ),
      moon: () => (
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      ),
      alert: () => (
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
          <line x1="12" y1="9" x2="12" y2="13" />
          <line x1="12" y1="17" x2="12.01" y2="17" />
        </svg>
      ),
      check: () => (
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="20 6 9 17 4 12" />
        </svg>
      ),
      history: () => (
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="12" r="10" />
          <polyline points="12 6 12 12 16 14" />
        </svg>
      ),
      file: () => (
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
          <polyline points="14 2 14 8 20 8" />
        </svg>
      ),
      send: () => (
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
          <line x1="22" y1="2" x2="11" y2="13" />
          <polygon points="22 2 15 22 11 13 2 9 22 2" />
        </svg>
      ),
      thought: () => (
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2" /><path d="M12 20v2" />
          <path d="m4.93 4.93 1.41 1.41" /><path d="m17.66 17.66 1.41 1.41" />
          <path d="M2 12h2" /><path d="M20 12h2" />
          <path d="m6.34 17.66-1.41 1.41" /><path d="m19.07 4.93-1.41 1.41" />
        </svg>
      ),
      diff: () => (
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M16 3h5v5" />
          <path d="M8 21H3v-5" />
          <path d="M21 3l-7.5 7.5" />
          <path d="M3 21l7.5-7.5" />
        </svg>
      ),
      refresh: () => (
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M23 4v6h-6" />
          <path d="M1 20v-6h6" />
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
        </svg>
      ),
      boxes: () => (
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />
          <polyline points="3.27 6.96 12 12.01 20.73 6.96" />
          <line x1="12" y1="22.08" x2="12" y2="12" />
        </svg>
      ),
      terminal: () => (
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="4 17 10 11 4 5" />
          <line x1="12" y1="19" x2="20" y2="19" />
        </svg>
      ),
      chevronDown: () => (
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="6 9 12 15 18 9" />
        </svg>
      ),
      close: () => (
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      ),
      plus: () => (
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
      ),
      sidebar: () => (
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <rect width="18" height="18" x="3" y="3" rx="2" />
          <path d="M9 3v18" />
        </svg>
      ),
      message: () => (
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
        </svg>
      ),
    };

    function getToolSummary(name, args) {
      if (!args) return name;
      try {
        if (name === "add_task" && args.tasks) {
          const count = Array.isArray(args.tasks) ? args.tasks.length : 1;
          const first = Array.isArray(args.tasks) && args.tasks[0]?.description ? ` "${args.tasks[0].description.slice(0, 24)}…"` : "";
          return `+${count} task${count > 1 ? "s" : ""}${first}`;
        }
        if (name === "write_file" || name === "edit_file" || name === "create_file") {
          return args.path || args.filename || args.target_file || "file";
        }
        if (name === "exec" || name === "run_command" || name === "bash") {
          return args.command || args.cmd || "shell";
        }
        if (name === "read_file" || name === "view_file") {
          return args.path || args.filename || "file";
        }
        const keys = Object.keys(args);
        if (keys.length > 0) {
          const val = String(args[keys[0]]);
          return `${keys[0]}: ${val.slice(0, 28)}${val.length > 28 ? "…" : ""}`;
        }
      } catch {}
      return name;
    }

    function ToolChipRow({ tool, isZh }) {
      const [expanded, setExpanded] = useState(false);
      const isRunning = tool.status === "running";
      const isError = tool.status === "error" || tool.is_error;
      const summary = getToolSummary(tool.name, tool.args);

      return (
        <div className="rounded-xl border transition-all duration-150 overflow-hidden"
             style={{
               backgroundColor: isRunning ? "var(--orange-tint)" : "var(--surface)",
               borderColor: isRunning ? "var(--orange)" : isError ? "var(--red)" : "var(--line)",
             }}>
          <div
            onClick={() => setExpanded(!expanded)}
            className="flex items-center justify-between px-3.5 py-2 cursor-pointer hover:bg-black/5 dark:hover:bg-white/5 select-none"
          >
            <div className="flex items-center gap-2.5 min-w-0">
              <span
                className={`size-2 rounded-full shrink-0 ${isRunning ? "animate-pulse-subtle" : ""}`}
                style={{
                  backgroundColor: isRunning ? "var(--orange)" : isError ? "var(--red)" : "var(--green)"
                }}
              />
              <span className="font-mono font-semibold text-[12px]" style={{ color: "var(--ink)" }}>
                {tool.name}
              </span>
              <span className="text-[11px] truncate max-w-xs font-mono px-2 py-0.5 rounded border"
                    style={{ backgroundColor: "var(--inset)", borderColor: "var(--line)", color: "var(--ink-2)" }}>
                {summary}
              </span>
              {tool.risk_reason && (
                <span className="rounded px-1.5 py-0.2 text-[10px] font-medium"
                      style={{ backgroundColor: "rgba(246,143,60,0.15)", color: "var(--orange)" }}>
                  {tool.risk_reason}
                </span>
              )}
            </div>

            <div className="flex items-center gap-2 shrink-0 ml-2">
              <span className="text-[11px] font-mono" style={{ color: "var(--ink-3)" }}>
                {isRunning ? (isZh ? "执行中" : "Running") : `${tool.duration_ms || 0}ms`}
              </span>
              <div className="transition-transform duration-150" style={{ transform: expanded ? "rotate(180deg)" : "rotate(0deg)", color: "var(--ink-3)" }}>
                <Icons.chevronDown />
              </div>
            </div>
          </div>

          {expanded && (
            <div className="border-t px-3.5 py-3 space-y-2.5 text-[11px]" style={{ borderColor: "var(--line)", backgroundColor: "var(--inset)" }}>
              {tool.args && Object.keys(tool.args).length > 0 && (
                <div>
                  <div className="font-semibold mb-1 text-[10.5px] uppercase tracking-wider" style={{ color: "var(--ink-3)" }}>Arguments</div>
                  <pre className="p-2.5 rounded-lg font-mono overflow-x-auto border"
                       style={{ backgroundColor: "var(--canvas)", borderColor: "var(--line)", color: "var(--ink)" }}>
                    {JSON.stringify(tool.args, null, 2)}
                  </pre>
                </div>
              )}

              {tool.preview && (
                <div>
                  <div className="font-semibold mb-1 text-[10.5px] uppercase tracking-wider" style={{ color: "var(--ink-3)" }}>Preview</div>
                  <pre className="p-2.5 rounded-lg font-mono overflow-x-auto border"
                       style={{ backgroundColor: "var(--canvas)", borderColor: "var(--line)", color: "var(--ink)" }}>
                    {tool.preview}
                  </pre>
                </div>
              )}

              {tool.result && (
                <div>
                  <div className="font-semibold mb-1 text-[10.5px] uppercase tracking-wider" style={{ color: "var(--ink-3)" }}>Result</div>
                  <pre className="p-2.5 rounded-lg font-mono overflow-x-auto max-h-40 border"
                       style={{ backgroundColor: "var(--canvas)", borderColor: "var(--line)", color: isError ? "var(--red)" : "var(--ink-2)" }}>
                    {tool.result}
                  </pre>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    function getSystemDark() {
      if (typeof window !== "undefined" && window.matchMedia) {
        return window.matchMedia("(prefers-color-scheme: dark)").matches;
      }
      return false;
    }

    function App() {
      const [isDark, setIsDark] = useState(() => {
        if (typeof window !== "undefined") {
          const saved = localStorage.getItem("fa_theme");
          if (saved !== null) return saved === "dark";
          return getSystemDark();
        }
        return false;
      });
      const [isZh, setIsZh] = useState(true);

      const [status, setStatus] = useState(null);
      const [connected, setConnected] = useState(false);
      const [activeMode, setActiveMode] = useState("react");
      const [isBusy, setIsBusy] = useState(false);

      // Layout state
      const [showLeftSidebar, setShowLeftSidebar] = useState(true);
      const [showRightSidebar, setShowRightSidebar] = useState(true);
      const [rightTab, setRightTab] = useState("team");

      // Conversation & Stream
      const [messages, setMessages] = useState([]);
      const [inputPrompt, setInputPrompt] = useState("");
      const [steerPrompt, setSteerPrompt] = useState("");
      const [activeThinking, setActiveThinking] = useState("");
      const [activeContent, setActiveContent] = useState("");
      const [activeToolCalls, setActiveToolCalls] = useState([]);
      const [pendingApproval, setPendingApproval] = useState(null);
      const [feedbackText, setFeedbackText] = useState("");
      const [thinkingExpanded, setThinkingExpanded] = useState(true);

      // Workspace & History data
      const [diffStats, setDiffStats] = useState({});
      const [artifacts, setArtifacts] = useState([]);
      const [savedSessions, setSavedSessions] = useState([]);
      const [inspectSession, setInspectSession] = useState(null);
      const [subagents, setSubagents] = useState([
        { id: "lead", name: "Coordinator", role: "Planning & Synthesis", status: "running", logs: ["Awaiting tasks"] },
        { id: "scout", name: "Scout Agent", role: "Search & Read", status: "pending", logs: [] },
        { id: "forge", name: "Coder Agent", role: "Code Implementation", status: "pending", logs: [] },
        { id: "audit", name: "Reviewer Agent", role: "QA & Verification", status: "pending", logs: [] },
      ]);

      const chatContainerRef = useRef(null);
      const activeContentRef = useRef("");
      const activeThinkingRef = useRef("");
      const activeToolCallsRef = useRef([]);

      activeContentRef.current = activeContent;
      activeThinkingRef.current = activeThinking;
      activeToolCallsRef.current = activeToolCalls;

      const scrollToBottom = useCallback(() => {
        if (!chatContainerRef.current) return;
        const el = chatContainerRef.current;
        const isNearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 180;
        if (isNearBottom) {
          el.scrollTop = el.scrollHeight;
        }
      }, []);

      useEffect(() => {
        document.documentElement.classList.toggle("dark", isDark);
      }, [isDark]);

      useEffect(() => {
        if (typeof window === "undefined" || !window.matchMedia) return;
        const media = window.matchMedia("(prefers-color-scheme: dark)");
        const handler = (e) => {
          const saved = localStorage.getItem("fa_theme");
          if (saved === null) {
            setIsDark(e.matches);
          }
        };
        media.addEventListener("change", handler);
        return () => media.removeEventListener("change", handler);
      }, []);

      const toggleTheme = () => {
        const next = !isDark;
        setIsDark(next);
        if (typeof window !== "undefined") {
          localStorage.setItem("fa_theme", next ? "dark" : "light");
        }
      };

      const safeFetch = async (url, options) => {
        try {
          const res = await fetch(url, options);
          return res;
        } catch {
          return null;
        }
      };

      const refreshStatus = useCallback(async () => {
        const res = await safeFetch("/api/status");
        if (res && res.ok) {
          try {
            const data = await res.json();
            setStatus(data);
            setActiveMode(data.mode);
            setIsBusy(data.status === "running");
            setConnected(true);
            return;
          } catch {}
        }
        setConnected(false);
      }, []);

      const refreshWorkspace = useCallback(async () => {
        const [diffRes, artRes, sessRes] = await Promise.all([
          safeFetch("/api/diff"),
          safeFetch("/api/artifacts"),
          safeFetch("/api/sessions"),
        ]);
        if (diffRes && diffRes.ok) {
          try {
            const d = await diffRes.json();
            setDiffStats(d.stats || {});
          } catch {}
        }
        if (artRes && artRes.ok) {
          try {
            const a = await artRes.json();
            setArtifacts(a.artifacts || []);
          } catch {}
        }
        if (sessRes && sessRes.ok) {
          try {
            const s = await sessRes.json();
            setSavedSessions(s.sessions || []);
          } catch {}
        }
      }, []);

      // Start a fresh new session
      const handleNewSession = async () => {
        if (isBusy) return;
        await safeFetch("/api/clear", { method: "POST" });
        setMessages([]);
        setActiveThinking("");
        setActiveContent("");
        setActiveToolCalls([]);
        refreshStatus();
        refreshWorkspace();
      };

      // Load & Resume a historical session
      const handleResumeSession = async (sessionId) => {
        if (isBusy) return;
        const res = await safeFetch(`/api/sessions/${sessionId}/resume`, { method: "POST" });
        if (res && res.ok) {
          const data = await res.json();
          setActiveMode(data.mode);
          refreshStatus();
          const detailRes = await safeFetch(`/api/sessions/${sessionId}`);
          if (detailRes && detailRes.ok) {
            const detail = await detailRes.json();
            const state = detail.state || {};
            const display = state.display_history || [];
            const restoredMsgs = [];
            for (let i = 0; i < display.length; i++) {
              const item = display[i];
              if (item.role === "user") {
                restoredMsgs.push({
                  id: `hist-u-${i}`,
                  role: "user",
                  content: item.content || (Array.isArray(item.content) ? item.content.map(c => c.text).join("\n") : ""),
                });
              } else if (item.role === "assistant") {
                restoredMsgs.push({
                  id: `hist-a-${i}`,
                  role: "assistant",
                  content: item.content || "",
                  thinking: item.thinking || "",
                  toolCalls: (item.tool_calls || []).map(tc => ({
                    call_id: tc.id || `tc-${i}`,
                    name: tc.function?.name || tc.name || "tool",
                    args: typeof tc.function?.arguments === "string" ? JSON.parse(tc.function.arguments || "{}") : tc.args || {},
                    status: "completed",
                  })),
                });
              }
            }
            setMessages(restoredMsgs);
          }
          refreshWorkspace();
          setInspectSession(null);
        }
      };

      const handleInspectSession = async (sessionId) => {
        const res = await safeFetch(`/api/sessions/${sessionId}`);
        if (res && res.ok) {
          const data = await res.json();
          setInspectSession(data);
        }
      };

      // SSE connection
      useEffect(() => {
        refreshStatus();
        refreshWorkspace();

        let es = null;
        try {
          es = new EventSource("/api/events");
          es.onopen = () => setConnected(true);
          es.onerror = () => setConnected(false);

          es.addEventListener("connected", () => {
            setConnected(true);
            refreshStatus();
          });

          es.addEventListener("status", (e) => {
            try {
              const payload = JSON.parse(e.data);
              if (payload.data?.state === "running") setIsBusy(true);
              refreshStatus();
            } catch {}
          });

          es.addEventListener("mode_changed", (e) => {
            try {
              const payload = JSON.parse(e.data);
              if (payload.data?.mode) setActiveMode(payload.data.mode);
              refreshStatus();
            } catch {}
          });

          es.addEventListener("thinking_delta", (e) => {
            try {
              const payload = JSON.parse(e.data);
              setActiveThinking(payload.data?.accumulated || "");
              scrollToBottom();
            } catch {}
          });

          es.addEventListener("content_delta", (e) => {
            try {
              const payload = JSON.parse(e.data);
              setActiveContent(payload.data?.accumulated || "");
              scrollToBottom();
            } catch {}
          });

          es.addEventListener("turn_fallback", (e) => {
            try {
              const payload = JSON.parse(e.data);
              if (payload.data?.text) setActiveContent(payload.data.text);
              if (payload.data?.thinking) setActiveThinking(payload.data.thinking);
              scrollToBottom();
            } catch {}
          });

          es.addEventListener("turn_complete", (e) => {
            try {
              const payload = JSON.parse(e.data);
              const text = payload.data?.text || activeContentRef.current;
              const thinking = payload.data?.thinking || activeThinkingRef.current;
              const toolCalls = [...activeToolCallsRef.current];

              if (text || thinking || toolCalls.length > 0) {
                setMessages((prev) => [
                  ...prev,
                  {
                    id: `msg-${Date.now()}`,
                    role: "assistant",
                    content: text,
                    thinking: thinking,
                    toolCalls: toolCalls,
                    timestamp: Date.now(),
                  },
                ]);
              }
              setActiveContent("");
              setActiveThinking("");
              setActiveToolCalls([]);
              refreshWorkspace();
              scrollToBottom();
            } catch {}
          });

          es.addEventListener("tool_call", (e) => {
            try {
              const payload = JSON.parse(e.data);
              const item = payload.data;
              setActiveToolCalls((prev) => {
                const idx = prev.findIndex((c) => c.call_id === item.call_id);
                if (idx >= 0) {
                  const next = [...prev];
                  next[idx] = { ...next[idx], ...item };
                  return next;
                }
                return [...prev, item];
              });
              scrollToBottom();
            } catch {}
          });

          es.addEventListener("tool_result", (e) => {
            try {
              const payload = JSON.parse(e.data);
              const item = payload.data;
              setActiveToolCalls((prev) =>
                prev.map((c) =>
                  c.call_id === item.call_id || c.name === item.name
                    ? { ...c, result: item.result, duration_ms: item.duration_ms, is_error: item.is_error, status: item.is_error ? "error" : "completed" }
                    : c
                )
              );
              refreshWorkspace();
              scrollToBottom();
            } catch {}
          });

          es.addEventListener("approval_required", (e) => {
            try {
              const payload = JSON.parse(e.data);
              setPendingApproval(payload.data);
            } catch {}
          });

          es.addEventListener("approval_resolved", () => {
            setPendingApproval(null);
            setFeedbackText("");
          });

          es.addEventListener("subagent_status", (e) => {
            try {
              const payload = JSON.parse(e.data);
              if (payload.data?.snapshots) {
                setSubagents(
                  payload.data.snapshots.map((s, idx) => ({
                    id: s.id || `sub-${idx}`,
                    name: s.name || s.role || `Agent ${idx + 1}`,
                    role: s.role || "Specialist",
                    status: s.status || "running",
                    action: s.action || s.current_action || "",
                    logs: s.logs || [],
                    tokens: s.tokens,
                    duration: s.duration,
                  }))
                );
              }
            } catch {}
          });

          es.addEventListener("final_answer", (e) => {
            try {
              const payload = JSON.parse(e.data);
              const finalContent = payload.data?.text || activeContentRef.current;
              if (finalContent) {
                setMessages((prev) => [
                  ...prev,
                  {
                    id: `final-${Date.now()}`,
                    role: "assistant",
                    content: finalContent,
                    thinking: activeThinkingRef.current,
                    toolCalls: [...activeToolCallsRef.current],
                    timestamp: Date.now(),
                  },
                ]);
              }
              setActiveContent("");
              setActiveThinking("");
              setActiveToolCalls([]);
              setIsBusy(false);
              refreshStatus();
              refreshWorkspace();
              scrollToBottom();
            } catch {}
          });

          es.addEventListener("task_ended", () => {
            setIsBusy(false);
            refreshStatus();
            refreshWorkspace();
          });
        } catch {
          setConnected(false);
        }

        const interval = setInterval(refreshStatus, 8000);
        return () => {
          if (es) es.close();
          clearInterval(interval);
        };
      }, [refreshStatus, refreshWorkspace, scrollToBottom]);

      const handleSwitchMode = async (mode) => {
        if (isBusy) return;
        const res = await safeFetch("/api/mode", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ mode }),

          setActiveMode(mode);
          refreshStatus();

        setMessages((prev) => [...prev, { id: `user-${Date.now()}`, role: "user", content: text, timestamp: Date.now() }]);
        setIsBusy(true);

        const res = await safeFetch("/api/run", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: text, mode: activeMode }),
        });
        if (!res || !res.ok) setIsBusy(false);

      const handleApproval = async (approved, autoAll = false) => {

            auto_all: autoAll,

        setFeedbackText("");

      const handleInterrupt = async () => {
        await safeFetch("/api/interrupt", { method: "POST" });
        setIsBusy(false);

      return (

              </div>

              {/* New Session Button */}
              <div className="p-3 border-b" style={{ borderColor: "var(--line)" }}>

                      onClick={() => setInspectSession(null)}
                      className="rounded-lg border px-3.5 py-1.5 text-[12px] font-medium cursor-pointer hover:bg-black/5 dark:hover:bg-white/5"
                      style={{ backgroundColor: "var(--surface)", borderColor: "var(--line)", color: "var(--ink-2)" }}
                    >
                      {isZh ? "关闭" : "Close"}
                    </button>
                    <button
                      type="button"
                      disabled={isBusy}
                      onClick={() => handleResumeSession(inspectSession.session_id)}
                      className="rounded-lg px-4 py-1.5 text-[12px] font-medium text-white shadow-sm cursor-pointer hover:opacity-90 flex items-center gap-1.5"
                      style={{ backgroundColor: "var(--accent)" }}
                    >
                      <Icons.bolt />
                      <span>{isZh ? "恢复此会话" : "Resume Session"}</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
